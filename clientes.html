<!DOCTYPE html><html lang="es"><head>
<meta charset="UTF-8">

<title>Yo Me Voy Excursiones · Próximos viajes</title>

<style>
:root{--navy:#0D1F3C;--blue:#1d4f86;--sky:#3f86c6;--sky2:#e8f1fb;--gold:#FFD400;--sun:#F6A623;--bg:#EEF3F8;--line:#E1E8F0;--ink:#12202f;--muted:#5f7286;--green:#1E9E63;--red:#E8323C;--amber:#B45309;--wa:#25D366;
 --sh:0 1px 2px rgba(13,31,60,.06),0 12px 30px -16px rgba(13,31,60,.4)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:'Nunito',-apple-system,system-ui,'Segoe UI',Roboto,sans-serif}
html{-webkit-text-size-adjust:100%}
body{background:radial-gradient(900px 340px at 50% -120px,#d6e4f3 0,rgba(214,228,243,0) 70%) no-repeat,var(--bg);color:var(--ink);font-size:15.5px;line-height:1.45;padding-bottom:calc(env(safe-area-inset-bottom) + 24px)}
img{max-width:100%}
button{font-family:inherit}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#0D1F3C 0%,#16345f 55%,#1d4f86 100%);color:#fff;box-shadow:0 12px 30px -20px rgba(13,31,60,.9);overflow:hidden}
.top::before{content:"";position:absolute;right:-60px;top:-90px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(246,166,35,.32),rgba(246,166,35,0) 65%);pointer-events:none}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#FFD400,#F6A623,#FFD400)}
.top-in{position:relative;max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 10px) max(14px,env(safe-area-inset-right)) 12px max(14px,env(safe-area-inset-left))}
.logo{width:54px;height:54px;border-radius:50%;background:#fff;flex-shrink:0;box-shadow:0 0 0 2.5px rgba(255,255,255,.95),0 8px 18px -6px rgba(0,0,0,.55);transition:width .25s,height .25s;cursor:pointer}
body.sc .logo{width:40px;height:40px}
.brand{min-width:0;flex:1}.brand b{display:block;font-size:17px;font-weight:900;line-height:1.15}.brand span{font-size:11px;font-weight:800;color:#FFD76A;letter-spacing:.8px;text-transform:uppercase}
.inst{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);color:#fff;border-radius:20px;padding:8px 12px;font-weight:900;font-size:12.5px;cursor:pointer;white-space:nowrap;display:none}
.wrap{max-width:900px;margin:0 auto;padding:16px max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left))}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:18px 16px;margin-bottom:16px;color:#fff;background:linear-gradient(135deg,#0D1F3C 0%,#1d4f86 70%,#3f86c6 100%);box-shadow:0 18px 34px -20px rgba(13,31,60,.85)}
.hero::after{content:"";position:absolute;right:-40px;bottom:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,212,0,.35),rgba(255,212,0,0) 65%)}
.hero h1{font-size:23px;font-weight:900;line-height:1.15;position:relative;text-wrap:balance}
.hero p{font-size:14px;color:#d7e6f6;font-weight:700;margin-top:5px;position:relative;max-width:42ch}
.hero .pts{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;position:relative}
.hero .pts span{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:800}
.sec{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#6a7d92;margin:4px 2px 10px;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:720px){.grid{grid-template-columns:1fr 1fr}}
.trip{background:#fff;border-radius:20px;overflow:hidden;box-shadow:var(--sh);border:1px solid rgba(225,232,240,.9);cursor:pointer;transition:transform .18s,box-shadow .18s;display:flex;flex-direction:column}
.trip:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(13,31,60,.07),0 22px 40px -18px rgba(13,31,60,.5)}
.trip:active{transform:scale(.985)}
.ph{position:relative;aspect-ratio:16/10;background:linear-gradient(135deg,#1d4f86,#3f86c6);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .4s}
.ph img.ok{opacity:1}
.ph .ini{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.9);font-size:42px}
.ph .fecha{position:absolute;left:12px;top:12px;background:#fff;border-radius:14px;padding:6px 10px;text-align:center;box-shadow:0 8px 18px -8px rgba(0,0,0,.5);line-height:1}
.ph .fecha b{display:block;font-size:22px;font-weight:900;color:var(--navy)}.ph .fecha small{font-size:11px;font-weight:900;color:var(--sky);text-transform:uppercase}
.ph .cnt{position:absolute;right:12px;top:12px}
.ph .shade{position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(transparent,rgba(13,31,60,.72))}
.ph h3{position:absolute;left:14px;right:14px;bottom:10px;color:#fff;font-size:22px;font-weight:900;line-height:1.15;text-shadow:0 2px 8px rgba(0,0,0,.35)}
.tb{padding:12px 14px 14px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.tb .m{font-size:13px;color:var(--muted);font-weight:700}
.tb .pr{text-align:right;flex-shrink:0}.tb .pr small{display:block;font-size:10.5px;color:var(--muted);font-weight:800;text-transform:uppercase}.tb .pr b{font-size:21px;font-weight:900;color:var(--navy)}
.chip{display:inline-block;font-size:12px;font-weight:900;padding:4px 10px;border-radius:20px;white-space:nowrap;box-shadow:0 6px 14px -8px rgba(0,0,0,.45)}
.chip.n{background:#e4edfb;color:#1d4f9f}.chip.a{background:#fff1d4;color:#8a5a00}.chip.r{background:#fde2e2;color:#b42318}.chip.h{background:linear-gradient(135deg,#1E9E63,#34c38f);color:#fff}.chip.x{background:#E8323C;color:#fff}
.empty{text-align:center;color:var(--muted);font-weight:700;padding:36px 16px;background:#fff;border-radius:20px;box-shadow:var(--sh)}
.empty b{display:block;font-size:17px;color:var(--ink);margin-bottom:4px}
.foot{text-align:center;color:var(--muted);font-size:13px;font-weight:700;padding:26px 10px 8px}
.foot a{color:var(--blue);font-weight:900;text-decoration:none}
/* detalle */
.back{display:inline-flex;align-items:center;gap:5px;border:0;background:#fff;color:var(--blue);font-weight:900;font-size:14px;border-radius:20px;padding:8px 14px 8px 11px;box-shadow:var(--sh);margin-bottom:12px;cursor:pointer}
.gal{position:relative;border-radius:20px;overflow:hidden;background:#0D1F3C;box-shadow:var(--sh)}
.gal .sl{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.gal .sl::-webkit-scrollbar{display:none}
.gal .it{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:4/3;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.gal .it .bgb{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(18px) brightness(.6)}
.gal .it img{position:relative;max-width:100%;max-height:100%;object-fit:contain}
.gal .dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px}
.gal .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5);transition:.2s}.gal .dots i.on{background:#fff;width:20px;border-radius:4px}
.gal .nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.85);color:var(--navy);font-size:20px;font-weight:900;cursor:pointer;box-shadow:0 6px 14px -6px rgba(0,0,0,.5)}
.gal .nav.p{left:10px}.gal .nav.n{right:10px}
@media(hover:none){.gal .nav{display:none}}
.gal .ini{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;font-size:56px;background:linear-gradient(135deg,#1d4f86,#3f86c6)}
.dh{background:#fff;border-radius:20px;padding:16px;margin-top:-26px;position:relative;box-shadow:var(--sh);margin-left:8px;margin-right:8px}
.dh h1{font-size:26px;font-weight:900;line-height:1.15;text-wrap:balance}
.dh .f{color:var(--muted);font-weight:800;font-size:14px;margin-top:4px}
.dh .rw{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.share{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px;font-weight:900;font-size:12.5px;color:var(--blue);cursor:pointer}
.box{background:#fff;border-radius:20px;padding:15px 16px;margin-top:12px;box-shadow:var(--sh);border:1px solid rgba(225,232,240,.9)}
.box h2{font-size:16px;font-weight:900;margin-bottom:9px}
.prs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prs div{background:#f4f7fb;border-radius:14px;padding:10px 6px;text-align:center}
.prs b{display:block;font-size:21px;font-weight:900;color:var(--navy);line-height:1.1}.prs small{display:block;font-size:11px;color:var(--muted);font-weight:800;margin-top:2px}
.sal{display:flex;flex-direction:column;gap:0}
.sal div{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}.sal div:last-child{border-bottom:0}
.sal i{width:30px;height:30px;border-radius:50%;background:var(--sky2);display:flex;align-items:center;justify-content:center;font-style:normal;flex-shrink:0}
.sal span{flex:1;font-weight:800}.sal b{font-size:17px;font-weight:900;color:var(--navy);font-variant-numeric:tabular-nums}
.desc{white-space:pre-line;font-size:15px;color:#2b3b4d}
.cta{position:sticky;bottom:0;z-index:15;margin:16px -14px 0;padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(rgba(238,243,248,0),var(--bg) 30%)}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;font-weight:900;font-size:16.5px;cursor:pointer;text-align:center;text-decoration:none;transition:transform .12s,box-shadow .2s}
.btn:active{transform:scale(.98)}
.bgold{background:linear-gradient(135deg,#FFE14D,#FFC400);color:var(--navy);box-shadow:0 14px 30px -10px rgba(214,150,0,.75)}
.bp{background:linear-gradient(135deg,#0D1F3C,#1d4f86);color:#fff;box-shadow:0 10px 20px -12px rgba(13,31,60,.8)}
.bw{background:var(--wa);color:#fff;box-shadow:0 10px 20px -12px rgba(37,211,102,.8)}
.bg2{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn[disabled]{background:#cfd8e3;color:#6a7d92;box-shadow:none;cursor:not-allowed}
/* formulario */
.ov{position:fixed;inset:0;z-index:40;background:rgba(10,20,35,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex;animation:fadein .2s}
.sheet{background:#fff;width:100%;max-width:620px;max-height:94vh;max-height:94dvh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:subir .32s cubic-bezier(.2,.9,.3,1)}
@media(min-width:660px){.ov{align-items:center}.sheet{border-radius:22px;max-height:90vh}}
.sh-h{padding:20px 16px 10px;border-bottom:1px solid var(--line);position:relative;flex-shrink:0}
.sh-h::before{content:"";position:absolute;top:8px;left:50%;width:42px;height:5px;margin-left:-21px;border-radius:3px;background:#d5dee8}
.sh-h h2{font-size:19px;font-weight:900}.sh-h .s{font-size:13px;color:var(--muted);font-weight:700}
.sh-x{position:absolute;right:12px;top:14px;width:34px;height:34px;border-radius:50%;border:0;background:#eef3f8;font-size:18px;font-weight:900;color:var(--navy);cursor:pointer}
.sh-b{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px 16px;flex:1}
.sh-f{padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);border-top:1px solid var(--line);flex-shrink:0;background:#fff}
label{display:block;font-size:12px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin:13px 0 6px}
input,select,textarea{width:100%;font-size:16px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-family:inherit;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 4px rgba(63,134,198,.16)}
textarea{min-height:70px;resize:vertical}
.cn{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1.5px solid var(--line);border-radius:14px;padding:9px 10px 9px 13px;margin-top:8px}
.cn b{display:block;font-size:15px}.cn small{color:var(--muted);font-weight:700;font-size:12px}
.cn .c{display:flex;align-items:center;gap:8px}
.cn .c button{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:22px;font-weight:900;color:var(--navy);cursor:pointer}
.cn .c button.pl{background:linear-gradient(135deg,#0D1F3C,#1d4f86);color:#fff;border-color:transparent}
.cn .c span{min-width:26px;text-align:center;font-size:20px;font-weight:900}
.opts{display:grid;gap:7px}
.op{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;cursor:pointer;font-weight:800}
.op i{width:20px;height:20px;border-radius:50%;border:2px solid #b9c6d4;flex-shrink:0}
.op.on{border-color:var(--sky);background:#f2f7fd}.op.on i{border:6px solid var(--blue)}
.op b{margin-left:auto;color:var(--navy)}
.tot{background:#f4f7fb;border-radius:14px;padding:12px;margin-top:12px}
.tot .r{display:flex;justify-content:space-between;padding:3px 0;font-weight:700}.tot .r.g{font-weight:900;font-size:17px;border-top:1px dashed #cfd9e4;margin-top:5px;padding-top:7px}
.pay{border:2px dashed #b9cde3;border-radius:16px;padding:12px;margin-top:12px;background:#fbfdff}
.pay .ln{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:6px 0}
.pay .ln span{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase}
.pay .ln b{font-size:15px;font-weight:900;word-break:break-all;text-align:right}
.cp{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:5px 9px;font-weight:900;font-size:12px;color:var(--blue);cursor:pointer;flex-shrink:0}
.up{border:2px dashed #b9cde3;border-radius:16px;padding:18px 12px;text-align:center;cursor:pointer;background:#fbfdff;font-weight:800;color:var(--blue)}
.up.ok{border-style:solid;border-color:#9BD9B8;background:#f0faf5;color:var(--green)}
.up img{max-height:160px;border-radius:10px;margin-top:8px;display:block;margin-left:auto;margin-right:auto}
.ck{display:flex;gap:10px;align-items:flex-start;margin-top:14px;cursor:pointer;font-size:13.5px;color:#2b3b4d}
.ck i{width:24px;height:24px;border-radius:7px;border:2px solid #b9c6d4;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-weight:900}
.ck.on i{background:var(--green);border-color:var(--green)}
.err{color:var(--red);font-weight:800;font-size:13.5px;margin-top:10px;min-height:18px}
.hint{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:5px}
.okv{text-align:center;padding:10px 4px}
.okv .ic{width:76px;height:76px;margin:6px auto 10px;border-radius:50%;background:linear-gradient(135deg,#1E9E63,#34c38f);color:#fff;font-size:40px;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px -12px rgba(30,158,99,.8);animation:pop .5s cubic-bezier(.2,.9,.3,1.4)}
.okv h3{font-size:21px;font-weight:900}.okv p{color:#2b3b4d;margin-top:6px}
.okv .cod{display:inline-block;margin-top:10px;background:var(--navy);color:var(--gold);font-weight:900;letter-spacing:1.5px;border-radius:12px;padding:7px 14px;font-size:18px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%) translateY(10px);background:linear-gradient(135deg,#0D1F3C,#1d4f86);color:#fff;padding:11px 16px;border-radius:14px;font-weight:800;font-size:14px;opacity:0;transition:.2s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
.toast.s{opacity:1;transform:translateX(-50%)}
.sk{background:linear-gradient(90deg,#e6edf5 0,#f4f7fb 40%,#e6edf5 80%);background-size:300% 100%;animation:sk 1.3s linear infinite;border-radius:20px;height:250px}
.enter>*{animation:sube .42s cubic-bezier(.2,.8,.2,1) both}
.enter .grid>*{animation:sube .45s cubic-bezier(.2,.8,.2,1) both}.enter .grid>*:nth-child(2){animation-delay:.07s}.enter .grid>*:nth-child(3){animation-delay:.12s}.enter .grid>*:nth-child(n+4){animation-delay:.17s}
@keyframes sube{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes subir{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes sk{from{background-position:100% 0}to{background-position:0 0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

function hoyISO(){var d=new Date(),p=function(n){return (n<10?"0":"")+n};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}
function dias(iso){var a=(""+iso).split("-"),h=hoyISO().split("-");return Math.round((Date.UTC(+a[0],+a[1]-1,+a[2])-Date.UTC(+h[0],+h[1]-1,+h[2]))/864e5)}

 if(n===0)return '<span class="chip h">¡Sale hoy!</span>';if(n===1)return '<span class="chip r">⏳ ¡Mañana!</span>';
 return '<span class="chip '+(n<=3?"r":n<=7?"a":"n")+'">⏳ Faltan '+n+' días</span>'}

 if(!a.length&&v.punto)a=[{p:v.punto,h:v.hora||""}];return a.sort(function(x,y){return minH(x.h)-minH(y.h)})}
