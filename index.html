<style>
:root{--navy:#0D1F3C;--navy2:#16345f;--gold:#FFD400;--bg:#EEF3F8;--line:#DCE5EE;--muted:#5f7286;--green:#1E9E63;--greenbg:#E6F6EE;--amber:#B45309;--red:#E8323C;--rose:#D81B60;--wa:#25D366}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:#12202f;padding-bottom:100px;font-size:15px;line-height:1.4}
.top{background:var(--navy);color:#fff;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:20}
.top-in{max-width:900px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;display:flex;align-items:center;gap:10px}
.top img{width:34px;height:34px;border-radius:8px;background:#fff;flex-shrink:0}
.top b{font-size:14.5px;line-height:1.1}.top .s{font-size:9.5px;letter-spacing:.8px;color:#AEC6DC;text-transform:uppercase}
.dot{margin-left:auto;width:10px;height:10px;border-radius:50%;background:#7CFAB8;flex-shrink:0}.dot.off{background:#E8323C}
.tabs{max-width:900px;margin:0 auto;display:flex;gap:4px;padding:8px 12px 0}
.tab{flex:1;text-align:center;padding:9px 6px;font-size:13px;font-weight:800;color:#AEC6DC;border-bottom:3px solid transparent;cursor:pointer}
.tab.on{color:#fff;border-color:var(--gold)}
.wrap{max-width:900px;margin:0 auto;padding:13px 12px}
.back{display:inline-flex;align-items:center;gap:5px;background:none;border:none;color:var(--navy);font-weight:800;font-size:14px;margin-bottom:9px;cursor:pointer;padding:4px 0}
h2{font-size:17px;margin:2px 0 11px;line-height:1.25}
.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:10px;box-shadow:0 4px 16px -13px rgba(13,31,60,.5)}
.viaje{cursor:pointer}
.dias{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:20px;white-space:nowrap}
.dias.n{background:#e4edfb;color:#1d4f9f}.dias.a{background:#fff1d4;color:#8a5a00}.dias.r{background:#fde2e2;color:#b42318}.dias.h{background:#d9f5e3;color:#0d7a3e}.dias.v{background:#e9ebf0;color:#5b6678}
.viaje.venc{opacity:.72;background:#f6f7f9}
.sec{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:14px 2px 8px}

<style id="ui2">
/* ===== Interfaz v4: más visual y dinámica (solo aspecto, misma lógica) ===== */
:root{--navy:#0D1F3C;--navy2:#173a6b;--blue:#1d4f86;--sky:#3f86c6;--sky2:#e8f1fb;--sun:#F6A623;--bg:#EEF3F8;--line:#E1E8F0;--ink:#12202f;
 --sh:0 1px 2px rgba(13,31,60,.06),0 10px 28px -16px rgba(13,31,60,.38);--sh2:0 2px 4px rgba(13,31,60,.07),0 20px 38px -18px rgba(13,31,60,.5)}
*{font-family:'Nunito',-apple-system,system-ui,'Segoe UI',Roboto,sans-serif}
#pdf-area,#pdf-area *,#print-area,#print-area *{font-family:Arial,Helvetica,sans-serif}
body{background:radial-gradient(900px 340px at 50% -120px,#d6e4f3 0,rgba(214,228,243,0) 70%) no-repeat,var(--bg);color:var(--ink);font-size:15.5px}
/* cabecera con logo */
.top{background:linear-gradient(135deg,#0D1F3C 0%,#16345f 55%,#1d4f86 100%);border-bottom:0;box-shadow:0 12px 30px -20px rgba(13,31,60,.9);overflow:hidden}
.top::before{content:"";position:absolute;right:-60px;top:-90px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(246,166,35,.32),rgba(246,166,35,0) 65%);pointer-events:none}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#FFD400,#F6A623,#FFD400)}
.top-in{position:relative;padding:calc(env(safe-area-inset-top) + 10px) 14px 4px;gap:12px}
.top .logo{width:54px;height:54px;border-radius:50%;background:#fff;padding:1px;flex-shrink:0;box-shadow:0 0 0 2.5px rgba(255,255,255,.95),0 8px 18px -6px rgba(0,0,0,.55);transition:width .25s ease,height .25s ease;cursor:pointer}
body.sc .top .logo{width:40px;height:40px}
.brand{min-width:0}
.brand b{display:block;font-size:17px;font-weight:900;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .s{color:#FFD76A;font-weight:800;font-size:10px;letter-spacing:1.1px;white-space:nowrap}
@media(max-width:430px){.brand .s{display:none}.brand b{white-space:normal;line-height:1.12;font-size:16px}.who{max-width:40vw;padding:5px 9px 5px 8px}}
.who{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(4px);font-weight:800}
.tabs{width:calc(100% - 24px);margin:8px auto 13px;padding:4px;gap:4px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);border-radius:15px}
.tab{border:0;border-radius:11px;padding:9px 6px;color:#cfe0f1;font-weight:800;font-size:13.5px;transition:background .2s,color .2s,box-shadow .2s}
.tab:hover{color:#fff;background:rgba(255,255,255,.08)}
.tab.on{background:#fff;color:var(--navy);box-shadow:0 6px 14px -8px rgba(0,0,0,.6)}
/* contenido */
.wrap{padding:16px 14px}
h2{font-size:21px;font-weight:900;letter-spacing:-.2px;margin:2px 0 12px}
.card{border:1px solid rgba(225,232,240,.9);border-radius:18px;padding:15px;box-shadow:var(--sh);margin-bottom:12px}
.vgrid{display:grid;grid-template-columns:1fr;gap:12px}.vgrid .card{margin-bottom:0}
@media(min-width:760px){.vgrid{grid-template-columns:1fr 1fr}}
.viaje{transition:transform .18s ease,box-shadow .18s ease}
.viaje:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.viaje:active{transform:scale(.985)}
.viaje .d{font-size:17.5px;font-weight:900;line-height:1.25}
.viaje .m{font-weight:700}
.vnum{background:linear-gradient(135deg,#0D1F3C,#1d4f86);color:#FFD400;font-weight:900;padding:2px 9px}
.dias{font-weight:900;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.dias.h{background:linear-gradient(135deg,#1E9E63,#34c38f);color:#fff;animation:latido 1.8s ease-in-out infinite}
.dias.r{background:#fde2e2;color:#b42318}
.mini{gap:7px;margin-top:11px}
.mini>div{background:#f4f7fb;border-radius:12px;padding:8px 4px}
.mini b{font-size:15px;font-weight:900}.mini small{font-weight:800;letter-spacing:.3px}
.mini>div:nth-child(1) b{color:var(--navy)}.mini>div:nth-child(2) b{color:var(--green)}.mini>div:nth-child(3) b{color:var(--amber)}
.cap{background:#f4f7fb;border-radius:12px;padding:10px 11px;margin-top:10px}
.bar{height:10px;border-radius:8px;background:#dfe7f0}

.bar.warn i{background:linear-gradient(90deg,#d97706,#F6A623)}.bar.full i{background:linear-gradient(90deg,#c81e2a,#ef4b55)}
.vch span{background:var(--sky2);font-weight:700}
.sec{font-weight:900;letter-spacing:.08em;color:#6a7d92;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.sec-v::after{display:none}.sec-v{border-top:2px dashed #d3dde8}
/* resumen de bienvenida */
.resumen{position:relative;overflow:hidden;background:linear-gradient(135deg,#0D1F3C 0%,#1d4f86 70%,#3f86c6 100%);color:#fff;border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 18px 34px -20px rgba(13,31,60,.85)}
.resumen::after{content:"";position:absolute;right:-40px;bottom:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,212,0,.35),rgba(255,212,0,0) 65%)}
.resumen .hola{font-size:19px;font-weight:900;position:relative}
.resumen .prox{font-size:13.5px;color:#d7e6f6;margin-top:3px;font-weight:700;position:relative}
.resumen .prox b{color:#FFD400}
.resumen .rt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px;position:relative}

.resumen .rt b{display:block;font-size:22px;font-weight:900;line-height:1.1}
.resumen .rt small{display:block;font-size:10px;color:#cfe0f1;text-transform:uppercase;font-weight:800;letter-spacing:.3px;margin-top:2px}
.acc{display:flex;gap:8px;margin-bottom:6px}.acc .btn{padding:11px;font-size:13.5px}
/* cabecera del viaje */
.vhero{position:relative;overflow:hidden;background:linear-gradient(135deg,#0D1F3C 0%,#1d4f86 75%,#3f86c6 100%);color:#fff;border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 18px 34px -20px rgba(13,31,60,.85)}
.vhero::after{content:"";position:absolute;right:-50px;top:-70px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(246,166,35,.38),rgba(246,166,35,0) 65%)}
.vhero h2{color:#fff;margin:6px 0 4px;font-size:23px;position:relative}
.vhero .vm{font-size:13.5px;color:#d7e6f6;font-weight:700;position:relative}
.vhero .vb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:11px;position:relative}
.vhero .ved{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:20px;padding:5px 12px;font-size:12.5px;font-weight:800;cursor:pointer}
.vhero .ved:hover{background:rgba(255,255,255,.24)}
.vhero .vnum{background:#FFD400;color:var(--navy);position:relative}
.big-tot{gap:8px;margin-bottom:12px}
.big-tot>div{background:#fff;color:var(--ink);border-radius:15px;padding:11px 5px;box-shadow:var(--sh);border:1px solid rgba(225,232,240,.9)}
.big-tot b{font-size:19px;font-weight:900}.big-tot small{color:var(--muted);font-weight:800}
.big-tot>div:nth-child(1) b{color:var(--navy)}.big-tot>div:nth-child(2) b{color:var(--green)}.big-tot>div:nth-child(3) b{color:var(--amber)}
.back{font-weight:900;color:var(--blue);background:#fff;border-radius:20px;padding:7px 13px 7px 10px;box-shadow:var(--sh);margin-bottom:12px}
.back:active{transform:scale(.97)}
/* reservas */
.pax{border-radius:16px;padding:12px;box-shadow:0 1px 2px rgba(13,31,60,.05),0 8px 20px -16px rgba(13,31,60,.4);border-color:rgba(225,232,240,.9);transition:background .25s,border-color .25s}

.acts .tel{background:linear-gradient(135deg,#0D1F3C,#1d4f86)}
.cli,.usr,.log,.rcp{border-radius:16px;box-shadow:0 1px 2px rgba(13,31,60,.05),0 8px 20px -16px rgba(13,31,60,.4);border-color:rgba(225,232,240,.9);transition:transform .15s}
.cli:active{transform:scale(.985)}
.cli .av{background:linear-gradient(135deg,#1d4f86,#3f86c6);font-weight:900}

.btn{border-radius:14px;font-weight:900;transition:transform .12s,box-shadow .2s,background .2s,border-color .2s}
.btn:active{transform:scale(.98)}
.bp{background:linear-gradient(135deg,#0D1F3C,#1d4f86);box-shadow:0 10px 20px -12px rgba(13,31,60,.8)}
.bg2{border-color:var(--line);box-shadow:0 1px 2px rgba(13,31,60,.04)}.bg2:hover{border-color:#b9cde3;background:#fbfdff}
.chip{transition:background .15s,color .15s,border-color .15s;font-weight:800}
.chip.on,.ptab.on{background:linear-gradient(135deg,#0D1F3C,#1d4f86);border-color:transparent}
.search input{border-radius:14px;box-shadow:0 1px 2px rgba(13,31,60,.04)}

.fab:hover{box-shadow:0 18px 34px -10px rgba(214,150,0,.85)}
.fab:active{transform:translateX(-50%) scale(.96)}

.ov{background:rgba(10,20,35,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.ov.on{animation:fadein .2s ease}
.ov.on .sheet{animation:subir .32s cubic-bezier(.2,.9,.3,1)}
.sheet{border-radius:24px 24px 0 0;box-shadow:0 -10px 40px -10px rgba(0,0,0,.35)}
.sh-h{position:relative;padding-top:20px}

.toast{border-radius:14px;background:linear-gradient(135deg,#0D1F3C,#1d4f86);box-shadow:0 14px 30px -12px rgba(13,31,60,.7);font-weight:800}
.empty{font-weight:700}

#login{background:radial-gradient(circle at 25% 0%,#2a64a3 0,#163a6a 35%,#0D1F3C 75%)}
#login .box{position:relative;margin-top:64px;border-radius:24px;padding:78px 22px 22px;box-shadow:0 30px 60px -25px rgba(0,0,0,.7);animation:subir .45s cubic-bezier(.2,.9,.3,1)}
#login .lg-logo{position:absolute;top:-66px;left:50%;width:134px;height:134px;margin-left:-67px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.95),0 20px 40px -12px rgba(0,0,0,.65);animation:flota 4s ease-in-out infinite}
#login h1{text-align:center;font-size:22px;font-weight:900}#login .s{text-align:center;font-weight:700}
#login .btn{font-size:16px}
/* animaciones */
.enter>*{animation:sube .42s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2){animation-delay:.04s}.enter>*:nth-child(3){animation-delay:.08s}.enter>*:nth-child(4){animation-delay:.12s}.enter>*:nth-child(5){animation-delay:.16s}.enter>*:nth-child(n+6){animation-delay:.2s}
.enter .vgrid>*{animation:sube .45s cubic-bezier(.2,.8,.2,1) both}
.enter .vgrid>*:nth-child(2){animation-delay:.08s}.enter .vgrid>*:nth-child(3){animation-delay:.13s}.enter .vgrid>*:nth-child(4){animation-delay:.18s}.enter .vgrid>*:nth-child(n+5){animation-delay:.22s}
.enter .bar i{animation:llena .9s cubic-bezier(.2,.8,.2,1) .15s both}
@keyframes sube{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes llena{from{width:0}}
@keyframes subir{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes fabin{from{opacity:0;transform:translateX(-50%) translateY(30px) scale(.9)}to{opacity:1;transform:translateX(-50%)}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

function getSrv(path){var c=SRVO,a=path.split("/");for(var i=0;i<a.length;i++){if(c==null||typeof c!=="object")return undefined;c=c[a[i]]}return c}
function cv(v){if(v===undefined||v===null)return"—";if(typeof v==="boolean")return v?"sí":"no";if(Array.isArray(v))return"["+v.length+" pers.]";if(typeof v==="object")return"{…}";var s=""+v;return s===""?"(vacío)":(s.length>40?s.slice(0,40)+"…":s)}
function difViaj(A,B){A=A||[];B=B||[];if(A.length!==B.length)return["personas: "+A.length+" → "+B.length];
 var o=[],k=["nombre","tipo","edad","rec","emb","cob","subeEn"];
 for(var i=0;i<B.length;i++)k.forEach(function(f){var a=(A[i]||{})[f],b=(B[i]||{})[f];if(JSON.stringify(a)!==JSON.stringify(b))o.push("persona "+(i+1)+" "+f+": "+cv(a)+" → "+cv(b))});
 return o}
function difKeys(a,b){var o=[];a=a||{};Object.keys(b||{}).forEach(function(x){if(x==="pasajeros"||x==="id")return;var A=a[x],B=b[x];
 if(JSON.stringify(A)===JSON.stringify(B))return;
 if(x==="viajeros")difViaj(A,B).forEach(function(t){o.push(t)});else o.push(x+": "+cv(A)+" → "+cv(B))});return o}
function nomPaxLog(p){return "Reserva "+((p&&p.localizador)||"s/n")+" · "+((p&&p.nombre)||"")}
function descViajeLog(vId){var v=DB.viajes[vId]||(SRVO.viajes&&SRVO.viajes[vId])||{};return (v.destino||"viaje")+(v.fecha?" "+fmtF(v.fecha):"")}
function regLog(o){if(!ME)return;o.ts=SV.TIMESTAMP;o.uid=ME.uid;o.usuario=ME.usuario;o.nombre=ME.nombre;
 if(o.detalle&&o.detalle.length>600)o.detalle=o.detalle.slice(0,600)+"…";
 try{RT.ref("registro").push(o).catch(function(){})}catch(e){}}
function logEsc(kind,ruta,nuevo){
 try{
  if(!ME)return;
  var a=ruta.split("/"),antes=getSrv(ruta),e={ruta:ruta,accion:"modifica",viaje:"",objeto:"",detalle:""};
  if(a[0]==="clientes"){
   var notaCambio=(kind==="set"&&a[2]==="nota")||(kind==="update"&&nuevo&&typeof nuevo==="object"&&("nota" in nuevo));
   if(kind!=="remove"&&!notaCambio)return;
   var cl=(DB.clientes||{})[a[1]]||{};e.objeto="Cliente "+(cl.nombre||a[1]);
   if(kind==="remove"){e.accion="borra";e.detalle="Cliente eliminado"}
   else{var nn=kind==="set"?nuevo:nuevo.nota,aa=kind==="set"?antes:(antes||{}).nota;if(nn===aa)return;e.detalle="comentario: "+cv(aa)+" → "+cv(nn)}
  }else if(a[0]==="viajes"){
   e.viaje=descViajeLog(a[1]);
   var pasj=(a[2]==="pasajeros"&&a[3]);
   var oldP=pasj?getSrv("viajes/"+a[1]+"/pasajeros/"+a[3]):null;
   if(pasj){var cur=(DB.viajes[a[1]]||{}).pasajeros||{};e.objeto=nomPaxLog(oldP||cur[a[3]]||(kind==="update"&&a.length===4?nuevo:null))}
   else if(a.length===2)e.objeto="Viaje "+((getSrv(ruta)||DB.viajes[a[1]]||{}).destino||a[1]);
   else e.objeto="Viaje "+descViajeLog(a[1]);
   if(kind==="remove"){
    e.accion="borra";
    var js="";try{js=JSON.stringify(antes===undefined?null:antes)}catch(x){}
    if(js&&js.length<150000)e.antes=js;else e.detalle="(copia no guardada: demasiado grande) ";
    e.detalle+=pasj&&a.length===4?"Reserva eliminada":(a.length===2?"Viaje eliminado con "+Object.keys((antes||{}).pasajeros||{}).length+" reservas":"Dato eliminado");
   }else if(kind==="import"){e.accion="importa";e.detalle=Object.keys((nuevo||{}).pasajeros||{}).length+" reservas importadas"}
   else if(kind==="update"){
    if(antes===undefined){e.accion="crea";
     if(pasj&&a.length===4){var c=cuenta(viajeros(nuevo));e.detalle=(nuevo.nombre||"")+" · "+c.ad+" adulto(s)"+(c.ni?", "+c.ni+" niño(s)":"")+(c.be?", "+c.be+" bebé(s)":"")+" · "+money(+nuevo.importe||0)+(nuevo.vendedor?" · vend. "+nuevo.vendedor:"")}
     else e.detalle=(nuevo&&nuevo.destino)?(nuevo.destino+(nuevo.fecha?" "+fmtF(nuevo.fecha):"")):"Nuevo"
    }else{var d=difKeys(antes,nuevo);if(!d.length)return;e.detalle=d.join("; ")}
   }else{ /* set de un campo concreto */
    var campo=a[a.length-1];
    if(JSON.stringify(antes)===JSON.stringify(nuevo))return;
    if(campo==="viajeros")e.detalle=difViaj(antes,nuevo).join("; ");
    else if(campo==="buses")e.detalle="autobuses modificados";
    else e.detalle=campo+": "+cv(antes)+" → "+cv(nuevo);
    if(!e.detalle)return}
  }else return;
  regLog(e)}catch(x){}}

 var cap=t.cap?'<div class="cap"><div style="display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:800;margin-bottom:6px;flex-wrap:wrap"><span>'+t.plazas+' / '+t.cap+' plazas</span><span style="color:'+(t.libres<0?"var(--red)":t.libres<=5?"var(--amber)":"var(--green)")+'">'+(t.libres<0?"SOBREVENTA "+Math.abs(t.libres):t.libres+" libres")+'</span></div><div class="bar '+(t.libres<0?"full":t.libres<=5?"warn":"")+'"><i style="width:'+Math.min(100,t.plazas/t.cap*100)+'%"></i></div><div class="bl">'+esc(busNames(v))+'</div></div>'
  :(venc?'':'<div class="cap"><div class="bl">⚠️ Sin autobús asignado — ábrelo y elige el bus</div></div>');
 return '<div class="card viaje'+(venc?' venc':'')+'" onclick="abrir(\''+v.id+'\')">'+contadorHTML(v,true)+(v.num?'<span class="vnum">Nº '+v.num+'</span>':"")+
  '<span class="d">🚌 '+esc(v.destino)+'</span><div class="m">'+(v.fecha?fmtF(v.fecha):"sin fecha")+(v.hora?" · "+esc(v.hora):"")+'</div>'+
  vchipsHTML(v)+statsViaje(v,t,"mini")+cap+'</div>'}
function resumenHTML(prox){
 var hr=new Date().getHours(),sal=hr<13?"Buenos días":hr<20?"Buenas tardes":"Buenas noches";
 var pl=0,sem=0;prox.forEach(function(v){pl+=totViaje(v).plazas;var n=diasHasta(v.fecha);if(n!==null&&n<=7)sem++});
 var nx=prox.filter(function(v){return v.fecha})[0],txt="";
 if(nx){var n=diasHasta(nx.fecha);txt='Próxima salida: <b>'+esc(nx.destino)+'</b> '+(n===0?"<b>¡hoy!</b>":n===1?"<b>mañana</b>":"en <b>"+n+" días</b>")}
 else txt="No hay salidas programadas todavía.";
 return '<div class="resumen"><div class="hola">'+sal+(ME&&ME.nombre?", "+esc(ME.nombre):"")+' 👋</div><div class="prox">'+txt+'</div>'+
  '<div class="rt"><div><b>'+prox.length+'</b><small>Próximos viajes</small></div><div><b>'+pl+'</b><small>Plazas vendidas</small></div><div><b>'+sem+'</b><small>Salen esta semana</small></div></div></div>'}
function renderLista(){
 _diaRender=hoyISO();
 var vs=Object.keys(DB.viajes).map(function(k){return DB.viajes[k]});
 var prox=vs.filter(function(v){return !viajePasado(v)}).sort(cmpProx);
 var venc=vs.filter(viajePasado).sort(function(a,b){return cmpProx(b,a)});
 var h=resumenHTML(prox)+'<div class="acc"><button class="btn bg2" onclick="modalImport()">\ud83d\udce5 Importar listado (Excel · PDF)</button></div>';
 if(!vs.length)h+='<div class="empty">Aún no hay viajes.<br>Pulsa <b>+ Nuevo viaje</b>.</div>';
 else{
  h+='<div class="sec">Próximos viajes ('+prox.length+')</div>';
  h+=prox.length?'<div class="vgrid">'+prox.map(function(v){return tarjetaViaje(v,false)}).join("")+'</div>':'<div class="empty" style="padding:14px 0">No hay viajes próximos.<br>Pulsa <b>+ Nuevo viaje</b>.</div>';
  if(venc.length){
   h+='<div class="sec sec-v" onclick="VENC_ABIERTO=!VENC_ABIERTO;render()">Viajes vencidos ('+venc.length+') <span>'+(VENC_ABIERTO?"▾ ocultar":"▸ mostrar")+'</span></div>';
   if(VENC_ABIERTO)h+='<div class="vgrid">'+venc.map(function(v){return tarjetaViaje(v,true)}).join("")+'</div>'}}
 document.getElementById("app").innerHTML=h}

function filtra(p,v){
 if(FPT!=="__all"&&!enPunto(p,FPT,v).length)return false;
 if(!Q)return true;var q=Q.toLowerCase(),d=q.replace(/\D/g,"");
 if((p.nombre||"").toLowerCase().indexOf(q)>=0)return true;
 if((p.localizador||"").toLowerCase().indexOf(q)>=0)return true;
 if(d&&(p.tel||"").replace(/\D/g,"").indexOf(d)>=0)return true;
 return viajeros(p).some(function(x){return (x.nombre||"").toLowerCase().indexOf(q)>=0})}

function renderDetalle(){
 var v=DB.viajes[CUR];if(!v){VIEW="lista";return render()}
 var t=totViaje(v),pts=puntosDe(v);
 var lista=paxArr(v).sort(function(a,b){return (a.ts||0)-(b.ts||0)}).filter(function(p){return filtra(p,v)});
 var h='<button class="back" onclick="VIEW=\'lista\';Q=\'\';FPT=\'__all\';render()">‹ Viajes</button>';
 h+='<div class="vhero">'+(v.num?'<span class="vnum">Nº '+v.num+'</span>':"")+'<h2>🚌 '+esc(v.destino)+'</h2>'+
  '<div class="vm">'+(v.fecha?'📅 '+esc(fmtLargoMin(v.fecha)):"📅 Sin fecha")+(v.hora?' · 🕐 '+esc(v.hora):"")+'</div>'+
  '<div class="vb">'+contadorHTML(v,false)+'<span class="ved" onclick="modalViaje(\''+v.id+'\')">✏️ Editar viaje</span></div></div>';
 h+=statsViaje(v,t,"big-tot");
 h+=ventasHTML(v);
 h+='<div class="card" style="padding:12px">'+(t.cap?
   '<div style="display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:800;margin-bottom:7px;flex-wrap:wrap"><span>Ocupación '+t.plazas+' / '+t.cap+'</span><span style="color:'+(t.libres<0?"var(--red)":t.libres<=5?"var(--amber)":"var(--green)")+'">'+(t.libres<0?"SOBREVENTA de "+Math.abs(t.libres):t.libres+" libres")+'</span></div>'+
   '<div class="bar '+(t.libres<0?"full":t.libres<=5?"warn":"")+'"><i style="width:'+Math.min(100,t.plazas/t.cap*100)+'%"></i></div>'+
   '<div class="bl">'+esc(busNames(v))+(t.bebes?" · "+t.bebes+" bebé(s) sin plaza":"")+'</div>'
  :'<b style="font-size:13px">⚠️ Sin autobús asignado</b><div class="bl">No se pueden controlar las plazas libres.</div>')+
  '<button class="btn bg2" style="margin-top:9px;padding:10px;font-size:13.5px" onclick="modalBuses(\''+v.id+'\')">🚌 '+(t.cap?"Cambiar / añadir autobuses":"Elegir autobuses")+'</button></div>';
 if(esAdmin())h+='<button class="btn bp" style="margin-bottom:10px;background:var(--green)" onclick="modalScan()">📷 Escanear QR de embarque</button>';
 h+='<div class="search"><input id="q" placeholder="🔍 Nombre, acompañante, teléfono o localizador" value="'+esc(Q)+'" oninput="Q=this.value;renderDetalle();var e=document.getElementById(\'q\');e.focus();e.setSelectionRange(e.value.length,e.value.length)"></div>';
 h+='<div class="chips"><div class="chip '+(FPT==="__all"?"on":"")+'" onclick="FPT=\'__all\';renderDetalle()">Todos ('+t.plazas+')</div>';
 pts.forEach(function(r){h+='<div class="chip '+(FPT===r?"on":"")+'" onclick="FPT=\''+jsq(r)+'\';renderDetalle()">'+esc(r)+' ('+plazasPunto(v,r)+')</div>'});
 h+='</div>';if(esAdmin())h+='<button class="btn bg2" style="margin-bottom:8px" onclick="modalImport(\''+v.id+'\')">\ud83d\udce5 Importar reservas a este viaje (Excel · PDF)</button><button class="btn bp" style="margin-bottom:8px" onclick="pdfListado(\''+v.id+'\')">📄 PDF del listado '+(FPT==="__all"?"completo":"de "+esc(FPT))+'</button><button class="btn bg2" style="margin-bottom:11px" onclick="imprimir(\''+v.id+'\')">🖨️ Imprimir listado '+(FPT==="__all"?"completo":"de "+esc(FPT))+'</button>';
 h+=lista.length?lista.map(function(p){return paxRow(v,p)}).join(""):'<div class="empty">Ninguna reserva coincide.</div>';
 document.getElementById("app").innerHTML=h}

function snTxt(c){var a=[];if(c.adulto)a.push("+"+c.adulto+" adulto"+(c.adulto>1?"s":""));if(c.nino)a.push("+"+c.nino+" niño"+(c.nino>1?"s":""));if(c.bebe)a.push("+"+c.bebe+" bebé"+(c.bebe>1?"s":""));return a.join(", ")}
function splitSN(list,cond){var named=[],sn={adulto:0,nino:0,bebe:0};list.forEach(function(x){if(cond&&!(x.nombre||"").trim()&&!x.edad)sn[x.tipo||"adulto"]++;else named.push(x)});return {named:named,sn:sn}}
function paxRow(v,p){
 var vId=v.id,vjs=viajeros(p),c=cuenta(vjs),pl=c.ad+c.ni,tel=normTel(p.tel),mx=mixto(p,v);
 var sp=splitSN(vjs.slice(1),!mx),snt=snTxt(sp.sn);
 var acom=sp.named.map(function(x){
  var tg=x.tipo==="nino"?'<span class="tag n">niño'+(x.edad?" "+x.edad+"a":"")+'</span>':x.tipo==="bebe"?'<span class="tag b">bebé'+(x.edad?" "+x.edad:"")+'</span>':"";
  return tg+((x.emb&&!p.embarcado)?"✅ ":"")+esc(x.nombre||"(sin nombre)")+(mx?' <span class="tag pt">'+esc(recDe(p,x,v))+'</span>':"")}).join(" · ");
 if(snt)acom+=(acom?" · ":"")+'<span class="tag">'+snt+' sin nombre</span>';
 return '<div class="pax '+(p.embarcado?"emb":"")+' '+(p.cobrado?"cob":"")+'">'+
  '<div class="chk"'+(esAdmin()?' onclick="toggleEmb(\''+vId+'\',\''+p.id+'\')"':"")+'>'+(p.embarcado?"✓":"")+'</div><div class="i">'+
  '<div class="n"><span class="titu">TITULAR</span>'+((vjs[0]&&vjs[0].emb&&!p.embarcado)?"✅ ":"")+esc(vjs[0]?vjs[0].nombre:p.nombre)+(mx?' <span class="tag pt">'+esc(recDe(p,vjs[0],v))+'</span>':"")+'</div>'+
  (acom?'<div class="acom">'+acom+'</div>':"")+
  '<div class="mm">'+pl+' plaza(s)'+(c.be?" + "+c.be+" bebé":"")+(function(){var ne=embPlazas(p);return (ne>0&&ne<pl)?' · <b style="color:var(--green)">'+ne+'/'+pl+' subidos</b>':""})()+(mx?' <span class="tag mix">RECOGIDAS DISTINTAS</span>':" · "+esc(recBase(p,v)))+(pl===1?' <span class="tag solo">no sentar solo</span>':"")+(p.nota?" · "+esc(p.nota):"")+'</div>'+
  '<div class="mm">🧑‍💼 <b>'+esc(canonVend(p.vendedor))+'</b>'+recTag(v,p)+'</div>'+
  (p.localizador?'<div class="loc">'+esc(p.localizador)+'</div>':"")+
  '<div class="acts">'+
   (tel?'<button class="tel" onclick="menuTel(\''+tel+'\',\''+jsq(vjs[0]?vjs[0].nombre:p.nombre)+'\')">📞 '+esc(p.tel)+'</button>':"")+
   '<button class="just" onclick="justificante(\''+vId+'\',\''+p.id+'\')">🧾 Justificante</button>'+
   '<button class="just" onclick="billetes(\''+vId+'\',\''+p.id+'\')">🎟️ Billetes QR</button>'+
   '<button class="just" onclick="modalRecibos(\''+vId+'\',\''+p.id+'\')">📎 Recibo'+(nRec(p)?" ("+nRec(p)+")":"")+'</button>'+
   (esAdmin()?'<button class="bc" onclick="toggleCob(\''+vId+'\',\''+p.id+'\')">'+(p.cobrado?"✓ Cobrado":(cobPax(p)>0?"Cobrar "+r2((+p.pendiente||0)-cobPax(p))+"€ (cobrado "+cobPax(p)+"€)":"Cobrar "+(+p.pendiente||0)+"€"))+'</button>':"")+
   '<button onclick="modalPax(\''+vId+'\',\''+p.id+'\')">✏️</button>'+
   (esAdmin()?'<button onclick="delPax(\''+vId+'\',\''+p.id+'\')">🗑️</button>':"")+'</div></div>'+
  (esAdmin()?'<div class="r"><div class="eur">'+money(+p.pendiente||0)+'</div><div class="cob-lbl">COBRADO</div></div>':"")+'</div>'}


/* ---------- Clientes ---------- */
function nViajes(c){return Object.keys(c.viajes||{}).length}
function totPlazas(c){var v=c.viajes||{};return Object.keys(v).reduce(function(s,k){return s+(+v[k].plazas||0)},0)}
function renderClientes(){
 var cs=Object.keys(DB.clientes||{}).map(function(k){return DB.clientes[k]}).filter(function(c){
  if(!QC)return true;var q=QC.toLowerCase();
  return (c.nombre||"").toLowerCase().indexOf(q)>=0||(""+(c.tel||"")).indexOf(q.replace(/\D/g,""))>=0})
  .filter(function(c){return FC==="todos"||(FC==="repiten"?nViajes(c)>=2:nViajes(c)<2)})
  .sort(function(a,b){return nViajes(b)-nViajes(a)||(a.nombre||"").localeCompare(b.nombre||"")});
 var all=Object.keys(DB.clientes||{}).map(function(k){return DB.clientes[k]}),tot=all.length;
 var nrep=all.filter(function(c){return nViajes(c)>=2}).length;
 var h='<h2>Clientes ('+tot+')</h2>';
 h+='<button class="btn bg2" style="margin-bottom:10px;padding:11px;font-size:13.5px" onclick="sincClientes(false)">🔄 Sincronizar clientes con todas las reservas</button>';
 h+='<div class="search"><input id="qc" placeholder="🔍 Buscar cliente por nombre o teléfono" value="'+esc(QC)+'" oninput="QC=this.value;renderClientes();var e=document.getElementById(\'qc\');e.focus();e.setSelectionRange(e.value.length,e.value.length)"></div>';
 h+='<div class="chips"><div class="chip '+(FC==="todos"?"on":"")+'" onclick="FC=\'todos\';renderClientes()">Todos ('+tot+')</div><div class="chip '+(FC==="repiten"?"on":"")+'" onclick="FC=\'repiten\';renderClientes()">🔁 Repiten ('+nrep+')</div><div class="chip '+(FC==="nuevos"?"on":"")+'" onclick="FC=\'nuevos\';renderClientes()">Nuevos ('+(tot-nrep)+')</div></div>';
 h+=cs.length?cs.map(function(c){var n=nViajes(c);
  return '<div class="cli" onclick="abrirCliente(\''+c.tel+'\')"><div class="av">'+esc((c.nombre||"?").trim().charAt(0).toUpperCase())+'</div>'+
   '<div class="i"><div class="n">'+esc(c.nombre)+'</div><div class="m">'+esc(c.tel)+' · '+totPlazas(c)+' plazas'+(c.nota?' · 📝':"")+'</div></div>'+
   (n>=2?'<div class="b" style="background:var(--green);color:#fff">🔁 Repite · '+n+' viajes</div>':'<div class="b">Nuevo · '+n+' viaje'+(n===1?"":"s")+'</div>')+'</div>'}).join("")
  :'<div class="empty">'+(tot?"Ningún cliente coincide.":"Aún no hay clientes.<br>Se crean solos al guardar reservas con teléfono.")+'</div>';
 document.getElementById("app").innerHTML=h}
function abrirCliente(tel){
 var c=DB.clientes[tel];if(!c)return;
 var vs=Object.keys(c.viajes||{}).map(function(k){return c.viajes[k]}).sort(function(a,b){return (""+(b.fecha||"")).localeCompare(a.fecha||"")});
 var wa="https://wa.me/34"+c.tel+"?text="+encodeURIComponent("Hola "+c.nombre+", te escribo de "+MARCA+".");
 sheet('<h2>'+esc(c.nombre)+'</h2><div style="font-size:12.5px;color:var(--muted)">'+esc(c.tel)+' · '+nViajes(c)+' viaje(s) · '+totPlazas(c)+' plazas</div><div style="margin-top:6px;font-weight:800;font-size:13px;color:'+(nViajes(c)>=2?"var(--green)":"var(--muted)")+'">'+(nViajes(c)>=2?"🔁 Cliente que repite ("+nViajes(c)+" viajes)":"Cliente nuevo · primer viaje")+'</div>',
  '<label>Historial de viajes</label>'+
  (vs.length?vs.map(function(x){return '<div class="card" style="padding:10px;margin-bottom:7px"><b style="font-size:13.5px">'+(x.num?"Nº "+x.num+" · ":"")+esc(x.destino)+'</b><div style="font-size:12px;color:var(--muted)">'+fmtF(x.fecha)+' · '+x.plazas+' plaza(s)'+(x.acomp?" · "+x.acomp+" acompañante(s)":"")+(x.localizador?' · '+esc(x.localizador):"")+'</div></div>'}).join(""):'<div class="empty">Sin viajes registrados.</div>')+
  '<label>Comentario sobre el cliente</label><textarea id="c-nota" placeholder="Ej. paga siempre en efectivo · pide asiento delante…">'+esc(c.nota||"")+'</textarea>'+
  '<a class="btn bwa" style="margin-top:11px" href="'+wa+'" target="_blank" rel="noopener">💬 WhatsApp</a>'+
  '<a class="btn bg2" style="margin-top:8px" href="tel:+34'+c.tel+'">📞 Llamar</a>',
  '<button class="btn bg2" onclick="cerrar()">Cerrar</button><button class="btn bp" onclick="guardarNota(\''+c.tel+'\')">Guardar</button>')}
function guardarNota(tel){var n=document.getElementById("c-nota").value.trim();
 DB.clientes[tel].nota=n;wUpd("clientes/"+tel,{nota:n});cerrar();render();toast("Comentario guardado")}

 var wa="https://wa.me/34"+tel+"?text="+encodeURIComponent("Hola "+nombre+", te escribo de "+MARCA+" sobre tu reserva.");
 sheet('<h2>'+esc(nombre)+'</h2><div style="font-size:21px;font-weight:800;margin-top:4px">'+tel+'</div>',

/* ---------- Acciones ---------- */
function abrir(id){CUR=id;VIEW="detalle";Q="";FPT="__all";render()}
function fabAction(){VIEW==="lista"?modalViaje():modalPax(CUR)}
function toggleEmb(vId,pId){var p=DB.viajes[vId].pasajeros[pId];p.embarcado=!p.embarcado;wField("viajes/"+vId+"/pasajeros/"+pId+"/embarcado",p.embarcado);
 if(p.viajeros&&p.viajeros.length){p.viajeros.forEach(function(x){if(x.tipo!=="bebe")x.emb=p.embarcado});wField("viajes/"+vId+"/pasajeros/"+pId+"/viajeros",p.viajeros)}render()}
function toggleCob(vId,pId){var p=DB.viajes[vId].pasajeros[pId];p.cobrado=!p.cobrado;wField("viajes/"+vId+"/pasajeros/"+pId+"/cobrado",p.cobrado);
 if(!p.cobrado&&p.viajeros&&p.viajeros.length){p.viajeros.forEach(function(x){x.cob=0});wField("viajes/"+vId+"/pasajeros/"+pId+"/viajeros",p.viajeros)}render()}
function delPax(vId,pId){if(!esAdmin()){toast("⛔ Solo el administrador puede eliminar");return}if(confirm("¿Eliminar esta reserva?")){delete DB.viajes[vId].pasajeros[pId];wDel("viajes/"+vId+"/pasajeros/"+pId);render()}}

/* ---------- Sheet ---------- */
function sheet(head,body,foot){document.getElementById("sheet").innerHTML=
 '<div class="sh-h">'+head+'</div><div class="sh-b">'+body+'</div><div class="sh-f">'+(foot||"")+'</div>';
 document.getElementById("ov").classList.add("on")}

/* ---------- Escáner de embarque ---------- */
var _sc=null,_scBusy=false,_scLast=0,_busPt="";
function scMsg(t,c){var e=document.getElementById("scmsg");if(e){e.textContent=t;e.style.color=c||"var(--muted)"}}
function scPtHTML(){return PTS.map(function(pt){return '<div class="ptab '+(_busPt===pt?"on":"")+'" style="padding:9px 4px;font-size:12.5px" onclick="setBusPt(\''+jsq(pt)+'\')">'+esc(pt)+'</div>'}).join("")}
function setBusPt(x){_busPt=(_busPt===x)?"":x;var e=document.getElementById("scpt");if(e)e.innerHTML=scPtHTML();scInfo()}
function scInfo(){
 var e=document.getElementById("scinfo"),v=DB.viajes[CUR];if(!e||!v)return;
 var t=totViaje(v);
 if(!_busPt){e.innerHTML='Elige en qué punto estás: así queda registrado dónde sube cada uno.';return}
 var asig=plazasPunto(v,_busPt),sub=0;
 paxArr(v).forEach(function(p){viajeros(p).forEach(function(x){if(x.tipo!=="bebe"&&(p.embarcado||x.emb)&&recDe(p,x,v)===_busPt)sub++})});
 e.innerHTML='<b>'+esc(_busPt)+'</b>: subidos '+sub+' de '+asig+' asignados · total viaje '+t.emb+'/'+t.plazas}
function modalScan(){
 var v=DB.viajes[CUR];if(!v)return;
 sheet('<h2>📷 Escanear embarque</h2><div style="font-size:12.5px;color:var(--muted)">'+esc(v.destino)+'</div>',
  '<label style="margin-top:6px">Punto donde estás ahora</label><div class="ptabs" id="scpt">'+scPtHTML()+'</div>'+
  '<div id="scinfo" style="font-size:12.5px;margin-top:7px;color:var(--navy)"></div>'+
  '<div id="qr-reader" style="width:100%;border-radius:12px;overflow:hidden;background:#000;min-height:230px;margin-top:9px"></div>'+
  '<div id="scmsg" style="font-size:13px;font-weight:700;margin-top:9px;text-align:center;color:var(--muted)">Apunta al QR del billete</div>'+
  '<label>¿QR ilegible? Busca por nombre o localizador</label><input id="scq" placeholder="Nombre, titular o YMV-0001" oninput="scBuscar(this.value)"><div id="scres"></div>',
  '<button class="btn bg2" onclick="cerrar()">Cerrar</button>');
 scInfo();startScan()}
function scBuscar(q){
 var v=DB.viajes[CUR],e=document.getElementById("scres");if(!e||!v)return;
 q=(q||"").trim().toLowerCase();if(q.length<2){e.innerHTML="";return}
 var out=[];
 paxArr(v).forEach(function(p){var vj=viajeros(p),tit=((vj[0]||{}).nombre||p.nombre||"");
  vj.forEach(function(x,i){if(x.tipo==="bebe")return;

/* ---------- Importar: utilidades ---------- */
var IMP=[],IMPinfo="",IMPmeta={},IMPdest="",IMPupd=false;
var MESES=["ENERO","FEBRERO","MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"];
function norm(x){return (""+(x==null?"":x)).toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim()}
function numero(x){if(x==null||x==="")return 0;var s=(""+x).replace(/[^0-9,.\-]/g,"").replace(",",".");var n=parseFloat(s);return isNaN(n)?0:n}
function puntoDe(txt){var t=norm(txt);if(!t)return "";
 var c=[["Plaza Elíptica",Math.max(t.lastIndexOf("ELIPT"),t.lastIndexOf("ELIPIT"))],["Atocha",t.lastIndexOf("ATOCHA")],
  ["Puente de Vallecas",Math.max(t.lastIndexOf("VALLECAS"),/^PUENTE\b|\bPUENTE$/.test(t)?t.lastIndexOf("PUENTE"):-1)]];
 c.sort(function(a,b){return b[1]-a[1]});return c[0][1]>=0?c[0][0]:""}
function titulo(s){return (""+s).toLowerCase().replace(/(^|[\s\-(])([a-zà-ÿñ])/g,function(m,a,b){return a+b.toUpperCase()}).replace(/\b(De|La|Las|Del|Los|El|Y)\b/g,function(m,x,i){return i?m.toLowerCase():m})}
function claveNom(n){return norm(n).replace(/[^A-Z ]/g,"").split(" ").filter(Boolean).slice(0,2).join(" ")}

/* una persona a partir de un trozo de texto: "Luis (niño 6) [Atocha]" */
function persona(tok){
 var t=(""+tok).trim(),tipo="adulto",edad="",rec="";
 var b=t.match(/\[([^\]]*)\]/);if(b){rec=puntoDe(b[1]);t=t.replace(b[0],"")}
 var n=t.match(/\(\s*ni[ñn][oa]s?\s*(\d+)?[^)]*\)/i);if(n){tipo="nino";edad=n[1]||"";t=t.replace(n[0],"")}
 var e=t.match(/\(\s*beb[eé][^)]*\)/i);if(e){tipo="bebe";t=t.replace(e[0],"")}
 if(/^\s*ni[ñn][oa]\s*$/i.test(t))t="";
 t=t.replace(/\(.*?\)/g,"").replace(/\s+/g," ").replace(/^[,\s·-]+|[,\s·-]+$/g,"");
 return {nombre:t,tipo:tipo,edad:edad,rec:rec}}
function limpiaSinNombre(s){return (""+s).replace(/\+?\s*\d+\s+acompa[ñn]antes?\s+sin\s+nombre/gi,"").replace(/\(sin nombre\)/gi,"").replace(/\s+/g," ").trim()}
function partes(s){return limpiaSinNombre(s).split(/\s*,\s*|\s+[Yy]\s+|\s*\/\s*/).map(function(x){return x.trim()}).filter(function(x){return x&&!/^[,.\-·]+$/.test(x)})}
/* monta la lista de viajeros respetando las plazas */
function montaViajeros(tit,resto,pax,bebes){
 var vj=[];
 if(tit!=null){var p0=persona(tit);vj.push(p0)}
 (resto||[]).forEach(function(t){var p=persona(t);if(p.nombre||p.tipo!=="adulto")vj.push(p)});
 if(!vj.length)vj.push({nombre:"",tipo:"adulto",edad:"",rec:""});
 function ocupa(){return vj.filter(function(x){return x.tipo!=="bebe"}).length}
 /* si hay más huecos que plazas: quita los "sin nombre" sobrantes; un niño sin nombre pasa su tipo al último nombrado */
 while(ocupa()>pax){
  var ia=-1,ino=-1;for(var q=vj.length-1;q>0;q--){if(!vj[q].nombre&&vj[q].tipo==="adulto"&&ia<0)ia=q;if(!vj[q].nombre&&vj[q].tipo==="nino"&&ino<0)ino=q}
  if(ia>0){vj.splice(ia,1);continue}
  if(ino>0){var ed=vj[ino].edad;vj.splice(ino,1);
   for(var z=vj.length-1;z>=0;z--)if(vj[z].tipo==="adulto"&&vj[z].nombre){vj[z].tipo="nino";vj[z].edad=vj[z].edad||ed;break}
   continue}
  break}
 for(var k=ocupa();k<pax;k++)vj.push({nombre:"",tipo:"adulto",edad:"",rec:""});
 var be=vj.filter(function(x){return x.tipo==="bebe"}).length;
 for(var j=be;j<(bebes||0);j++)vj.push({nombre:"",tipo:"bebe",edad:"",rec:""});
 return vj}
function troceaNombres(nom,pax){var ps=partes(nom);return montaViajeros(ps[0]||nom,ps.slice(1),pax,0)}

/* destino y fecha a partir de los primeros textos del archivo */
function detectaMeta(textos){
 var m={destino:"",fecha:""};
 textos.slice(0,12).forEach(function(L){var t=norm(L);if(!t)return;
  if(!m.fecha){var d=t.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
   if(d)m.fecha=d[3]+"-"+("0"+d[2]).slice(-2)+"-"+("0"+d[1]).slice(-2);
   else{var e=t.match(new RegExp("(\\d{1,2})\\s+(?:DE\\s+)?("+MESES.join("|")+")(?:\\s+(?:DE\\s+)?(\\d{4}))?"));
    if(e)m.fecha=(e[3]||new Date().getFullYear())+"-"+("0"+(MESES.indexOf(e[2])+1)).slice(-2)+"-"+("0"+e[1]).slice(-2)}}
  if(!m.destino){var v=t.match(/VIAJE\s+A\s+(.+?)\s+EL\b/);
   if(v)m.destino=v[1];
   else if(/^[A-Z]/.test(t)&&!/^(LISTADO|SALIDA|VIAJA CON|CONDUCTOR|RECOGIDA|N|NOMBRE)/.test(t)){
    var c=t.split("·")[0].replace(/\b(LUNES|MARTES|MIERCOLES|JUEVES|VIERNES|SABADO|DOMINGO)\b.*$/,"").replace(/\s\d.*$/,"").trim();
    if(c.length>=3&&c.length<40)m.destino=c}}});
 if(m.destino)m.destino=titulo(m.destino);
 return m}

/* ---------- Excel / CSV ---------- */
function mapCols(fila){
 var m={};fila.forEach(function(c,i){var t=norm(c);
  if(m.nombre==null&&t.indexOf("NOMBRE")>=0)m.nombre=i;
  else if(m.pax==null&&(t.indexOf("CANT")>=0||t.indexOf("PERSONA")>=0||t==="PAX"||t==="PLAZAS"))m.pax=i;
  else if(m.se==null&&(t.indexOf("RESERVA")>=0||t.indexOf("SENAL")>=0||t.indexOf("PAGA")>=0||t.indexOf("PAGO")>=0))m.se=i;
  else if(m.pe==null&&(t.indexOf("PENDIENTE")>=0||t.indexOf("PDTE")>=0||t.indexOf("DEBE")>=0))m.pe=i;
  else if(m.tel==null&&(t.indexOf("TELEF")>=0||t.indexOf("MOVIL")>=0||t.indexOf("WHATS")>=0))m.tel=i;
  else if(m.rec==null&&(t.indexOf("RECOGIDA")>=0||t.indexOf("PUNTO")>=0||t.indexOf("PARADA")>=0))m.rec=i});
 return m}
function esBasura(n){var t=norm(n);
 return !t||/^(LISTADO|SALIDA|TOTAL|NOMBRES?|NOMBRE\(S\))\b/.test(t)}
function leerExcel(ab){
 var wb=XLSX.read(new Uint8Array(ab),{type:"array"}),out=[],textos=[];
 wb.SheetNames.forEach(function(sn){
  var f=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,blankrows:false,defval:""});
  var pHoja=puntoDe(sn),m=null;
  f.forEach(function(r){
   if(!r||!r.length)return;
   if(!m){ textos.push(r.join(" "));
     if(r.some(function(c){return norm(c).indexOf("NOMBRE")>=0})){m=mapCols(r)}
     else{var p=puntoDe(r.join(" "));if(p)pHoja=p}
     return}
   var nom=r[m.nombre];
   if(esBasura(nom))return;
   var pax=m.pax!=null?Math.round(numero(r[m.pax])):0;
   var ps=partes(nom);
   if(!pax)pax=Math.max(1,ps.length);
   var tel=m.tel!=null?(""+(r[m.tel]||"")).replace(/\D/g,"").slice(-9):"";
   out.push({vj:montaViajeros(ps[0]||(""+nom).trim(),ps.slice(1),pax,0),pax:pax,
    se:m.se!=null?numero(r[m.se]):0, pe:m.pe!=null?numero(r[m.pe]):0, tel:tel,
    rec:(m.rec!=null?puntoDe(r[m.rec]):"")||pHoja})});
 });
 IMPmeta=detectaMeta(textos);
 return out}

/* ---------- PDF (lectura por columnas) ---------- */
function leerPDF(ab){
 if(typeof pdfjsLib==="undefined")return Promise.reject(new Error("el lector de PDF no se ha cargado (revisa la conexión)"));
 try{pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"}catch(e){}
 return pdfjsLib.getDocument({data:new Uint8Array(ab)}).promise.then(function(doc){
  var t=[];for(var i=1;i<=doc.numPages;i++)t.push(doc.getPage(i).then(function(pg){return pg.getTextContent()}));
  return Promise.all(t)}).then(function(pags){
  var out=[],textos=[],raros=0,total=0,st={H:null,pDef:"",cur:null,primera:true};
  pags.forEach(function(tc){
   tc.items.forEach(function(it){var s=it.str||"";total+=s.length;raros+=(s.match(/[\u0000-\u001f]/g)||[]).length});
   leePagina(tc,out,textos,st);st.primera=false});
  if(st.cur){var rf=construye(st.cur,st.pDef);if(rf)out.push(rf);st.cur=null}
  if(total&&raros/total>0.25)throw new Error("este PDF no tiene texto legible (se exportó como imagen). Vuelve a exportarlo desde la app o pásalo a Excel.");
  IMPmeta=detectaMeta(textos);

function leePagina(tc,out,textos,st){

 else if(st.fin)return;

 if(H.pax==null)return;
 function col(o){
  if(H.num!=null&&Math.abs(o.x-H.num)<10&&/^\d{1,3}$/.test(o.s))return "num";

  var g={num:[],nom:[],pax:[],tel:[],rec:[],se:[],pe:[]};

}

 genPdfs(items,{titulo:"Billetes individuales",sub:esc(p.nombre)+" · "+items.length+" billete(s)",volver:"justificante('"+vId+"','"+pId+"')",ancho:700})}

/* ---------- Justificante ---------- */
var AVISO1="IMPORTANTE — EL PUNTO DE RECOGIDA NO SE PUEDE MODIFICAR.";
var ASIENTO1="ASIENTOS: POR ORDEN DE LLEGADA Y FIJOS TODO EL VIAJE.";
var ASIENTO2="Los asientos se asignan por orden de llegada al autobús y son intransferibles: el asiento que ocupes a la ida es obligatoriamente el mismo durante todo el viaje, también a la vuelta. Las plazas de la planta de abajo tienen prioridad para mujeres embarazadas, personas con movilidad reducida y personas mayores.";
var AVISO2="Si necesitas cambiarlo, avísanos con 2 DÍAS de antelación. No se aceptará ningún cambio de recogida en las últimas 48 horas: perjudica a los demás viajeros, que ya tienen su plaza asegurada, nos obliga a cambiarles de sitio y provoca retrasos importantes en los horarios de salida establecidos.";
function textoJust(v,p){
 var vjs=viajeros(p),c=cuenta(vjs),L=[],mx=mixto(p,v);
 L.push("*JUSTIFICANTE DE VIAJE*");
 L.push("Localizador: *"+(p.localizador||"—")+"*"+(v.num?"  ·  Viaje Nº "+v.num:""));
 L.push("");
 L.push("🚌 *MADRID → "+(v.destino||"").toUpperCase()+"*");
 if(v.fecha)L.push("📅 "+fmtLargoMin(v.fecha));
 if(!mx)L.push("📍 Recogida: *"+recBase(p,v)+"*"+(v.hora?"  ·  Salida "+v.hora:""));
 else L.push("📍 *ATENCIÓN: recogidas distintas* (ver cada pasajero)"+(v.hora?"  ·  Salida "+v.hora:""));
 L.push("⏰ Presentarse 15 minutos antes");
 if(v.regreso)L.push("🔙 Regreso desde "+v.destino+": "+v.regreso);
 L.push("");
 L.push("*PASAJEROS ("+(c.ad+c.ni)+" plaza(s)"+(c.be?" + "+c.be+" bebé":"")+")*");
 vjs.forEach(function(x,i){L.push((i+1)+". "+(x.nombre||"(sin nombre)")+
  (x.tipo==="nino"?" — niño"+(x.edad?" "+x.edad+" años":""):x.tipo==="bebe"?" — bebé"+(x.edad?" "+x.edad:"")+" (en brazos, gratis)":"")+
  (mx?"  ·  📍 "+recDe(p,x,v):""))});
 L.push("");
 L.push("*PAGO*");
 L.push("Total del viaje: "+money(+p.importe||importe(v,vjs)));
 L.push("Señal pagada: -"+money(+p.senal||0));
 L.push("*PENDIENTE en metálico el día del viaje: "+money(+p.pendiente||0)+"*");
 L.push("");
 L.push("⚠️ *"+AVISO1+"*");
 L.push(AVISO2);
 L.push("");
 L.push("💺 *"+ASIENTO1+"*");
 L.push(ASIENTO2);
 L.push("");
 L.push("_Presenta este justificante al subir al autobús. El autobús no espera: sé puntual. La señal no es reembolsable, pero es transferible avisando con 48 h._");
 L.push("");
 L.push(MARCA+"  ·  📞 "+TELS);
 return L.join("\n")}
function justificante(vId,pId,auto){
 var v=DB.viajes[vId],p=v.pasajeros[pId];if(!p)return;
 var run=function(){
  var tel=normTel(p.tel);
  var wa="https://wa.me/"+(tel?"34"+tel:"")+"?text="+encodeURIComponent(textoJust(v,p));
  var vjs=viajeros(p),c=cuenta(vjs),mx=mixto(p,v);
  sheet('<h2>'+(auto?"✅ Reserva guardada":"🧾 Justificante")+'</h2><div class="loc" style="margin-top:5px">'+esc(p.localizador)+'</div>',
   '<div class="sumbox"><div class="r"><span>Titular</span><b>'+esc(p.nombre)+'</b></div>'+
   '<div class="r"><span>Viaje</span><b>'+(v.num?"Nº "+v.num+" · ":"")+esc(v.destino)+'</b></div>'+
   '<div class="r"><span>Fecha</span><b>'+(v.fecha?fmtF(v.fecha):"—")+(v.hora?" · "+esc(v.hora):"")+'</b></div>'+
   '<div class="r"><span>Recogida</span><b>'+(mx?"varios puntos":esc(recBase(p,v)))+'</b></div>'+
   '<div class="r"><span>Pasajeros</span><b>'+(c.ad+c.ni)+' plaza(s)'+(c.be?" + "+c.be+" bebé":"")+'</b></div>'+
   '<div class="r"><span>Señal</span><b style="color:var(--green)">'+money(+p.senal||0)+'</b></div>'+
   '<div class="r big"><span>Pendiente</span><b style="color:var(--amber)">'+money(+p.pendiente||0)+'</b></div></div>'+
   '<a class="btn bwa" style="margin-top:12px" href="'+wa+'" target="_blank" rel="noopener">💬 Enviar por WhatsApp'+(tel?"":" (elegir contacto)")+'</a>'+
   '<button class="btn bp" style="margin-top:9px" onclick="pdfJust(\''+vId+'\',\''+pId+'\')">📄 Generar PDF</button>'+
   '<button class="btn bg2" style="margin-top:9px" onclick="billetes(\''+vId+'\',\''+pId+'\')">🎟️ Billetes individuales (1 QR por persona)</button>'+
   '<button class="btn bg2" style="margin-top:9px" onclick="imprimirJust(\''+vId+'\',\''+pId+'\')">🖨️ Imprimir</button>'+
   '<button class="btn bg2" style="margin-top:9px" onclick="copiarJust(\''+vId+'\',\''+pId+'\')">📋 Copiar texto</button>'+
   (tel?"":'<div class="note">Esta reserva no tiene teléfono: WhatsApp te pedirá elegir el contacto.</div>'),
   '<button class="btn bg2" onclick="cerrar()">'+(auto?"Listo":"Cerrar")+'</button>')};
 if(p.localizador)run();
 else nextNum("loc",1).then(function(n){p.localizador="YMV-"+pad(n,4);wField("viajes/"+vId+"/pasajeros/"+pId+"/localizador",p.localizador);run()})}
function copiarJust(vId,pId){var v=DB.viajes[vId],p=v.pasajeros[pId];
 if(navigator.clipboard)navigator.clipboard.writeText(textoJust(v,p));toast("Justificante copiado")}
function qrData(vId,pId){try{if(typeof qrcode==="undefined")return "";var q=qrcode(0,"M");q.addData("YMV:"+vId+":"+pId);q.make();return q.createDataURL(6,8)}catch(e){return ""}}
function qrBloque(v,p){var u=qrData(v.id,p.id);return u?'<div class="qr"><img src="'+u+'"><div>Código de embarque · enséñalo al subir al autobús</div></div>':""}
function htmlJust(v,p){
 var vjs=viajeros(p),c=cuenta(vjs),mx=mixto(p,v);
 var filas=vjs.map(function(x,i){return '<div class="rw"><span>'+(i+1)+'. '+esc(x.nombre||"(sin nombre)")+
  (x.tipo==="nino"?" · niño"+(x.edad?" "+x.edad+" años":""):x.tipo==="bebe"?" · bebé en brazos":"")+
  (mx?' · 📍 '+esc(recDe(p,x,v)):"")+'</span><b>'+(x.tipo==="bebe"?"gratis":x.tipo==="nino"?money(precioN(v)):money(+v.precioA||0))+'</b></div>'}).join("");
 return '<div class="jst">'+
  '<div class="hd"><div class="lc">'+esc(p.localizador||"")+'</div><h1>JUSTIFICANTE DE VIAJE</h1><div class="sub">'+MARCA+(v.num?"  ·  Viaje Nº "+v.num:"")+'</div></div>'+
  '<div class="rw"><span>Trayecto</span><b>MADRID → '+esc((v.destino||"").toUpperCase())+'</b></div>'+

  '<div class="rw"><span>Presentación</span><b>15 minutos antes</b></div>'+
  (v.regreso?'<div class="rw"><span>Regreso desde '+esc(v.destino)+'</span><b>'+esc(v.regreso)+'</b></div>':"")+
  '<h3>PASAJEROS ('+(c.ad+c.ni)+' plaza'+((c.ad+c.ni)===1?"":"s")+(c.be?" + "+c.be+" bebé":"")+')</h3>'+filas+
  (p.nota?'<div class="rw"><span>Nota</span><b>'+esc(p.nota)+'</b></div>':"")+
  '<div class="tot"><div class="rw"><span>Total del viaje</span><b>'+money(+p.importe||importe(v,vjs))+'</b></div>'+

  '<div class="pend"><span>PENDIENTE · en metálico el día del viaje</span><span>'+money(+p.pendiente||0)+'</span></div>'+
  '<div class="avi"><b>⚠️ '+AVISO1+'</b><br>'+AVISO2+'</div>'+

  qrBloque(v,p)+'<div class="cond">· Presenta este justificante (impreso o en el móvil) al subir al autobús.<br>· El autobús no espera: preséntate 15 minutos antes en el punto indicado.<br>· La señal no es reembolsable, pero es transferible a otra persona o a otra excursión avisando con 48 h de antelación.<br>· La organización no se responsabiliza de objetos personales olvidados.</div>'+
  '<div class="ft">YO ME VOY EXCURSIONES · Reservas e información: '+TELS+'</div></div>'}
function imprimirJust(vId,pId){var v=DB.viajes[vId],p=v.pasajeros[pId];document.getElementById("print-area").innerHTML=htmlJust(v,p);window.print()}
var _pdfs=[];
function pdfJust(vId,pId){
 var v=DB.viajes[vId],p=v.pasajeros[pId];if(!p)return;
 genPdf({html:htmlJust(v,p),nombre:"Justificante-"+(p.localizador||"reserva")+".pdf",ancho:700,titulo:"PDF listo",
  sub:esc(p.nombre),volver:"justificante('"+vId+"','"+pId+"')"})}
function renderPdf(o){return new Promise(function(res,rej){
 var host=document.getElementById("pdf-area");host.style.width=o.ancho+"px";host.innerHTML=o.html;
 var sy=window.pageYOffset||0,sx=window.pageXOffset||0;window.scrollTo(0,0);
 var vuelve=function(){host.innerHTML="";window.scrollTo(sx,sy)};
 setTimeout(function(){
  html2pdf().set({margin:[8,8,8,8],filename:"x.pdf",image:{type:"jpeg",quality:.95},html2canvas:{scale:2,useCORS:true,backgroundColor:"#ffffff",windowWidth:o.ancho,scrollX:0,scrollY:0,x:0,y:0},
   jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},pagebreak:{mode:["css","legacy"],avoid:["tr",".gr-h",".fir",".avi",".tot",".pend",".qr"]}})
   .from(host).outputPdf("blob").then(function(b){vuelve();res(b)}).catch(function(e){vuelve();rej(e)})},250)})}
function genPdfs(items,o){
 if(typeof html2pdf==="undefined"){toast("No cargó el generador de PDF (revisa la conexión)");return}
 if(!items.length||!items[0].html){toast("Nada que generar");return}
 toast("Generando "+items.length+" PDF…");_pdfs=[];
 items.reduce(function(pr,it){return pr.then(function(){return renderPdf({html:it.html,ancho:o.ancho||700}).then(function(b){_pdfs.push({blob:b,nombre:it.nombre,label:it.label||it.nombre})})})},Promise.resolve())
  .then(function(){showPdfs(o)}).catch(function(e){toast("No se pudo generar el PDF: "+(e&&e.message||e))})}
function genPdf(o){genPdfs([{html:o.html,nombre:o.nombre}],o)}
function showPdfs(o){
 var multi=_pdfs.length>1;
 sheet('<h2>📄 '+o.titulo+'</h2><div style="font-size:12.5px;color:var(--muted)">'+(o.sub||"")+'</div>',
  (multi?_pdfs.map(function(f,i){return '<div class="imp" style="padding:10px"><b>'+esc(f.label)+'</b><div style="display:flex;gap:6px;margin-top:7px"><button class="btn bwa" style="padding:9px;font-size:13px" onclick="compartirPdf('+i+')">📤 Compartir</button><button class="btn bg2" style="padding:9px;font-size:13px;width:60px" onclick="descargarPdf('+i+')">⬇️</button></div></div>'}).join("")+
   '<button class="btn bp" style="margin-top:6px" onclick="compartirPdf()">📤 Compartir todos a la vez</button><button class="btn bg2" style="margin-top:8px" onclick="descargarPdf()">⬇️ Descargar todos</button>'
  :'<div class="sumbox"><div class="r"><span>Archivo</span><b>'+esc(_pdfs[0].nombre)+'</b></div></div>'+
   '<button class="btn bwa" style="margin-top:12px" onclick="compartirPdf(0)">📤 Compartir (WhatsApp, etc.)</button><button class="btn bp" style="margin-top:9px" onclick="descargarPdf(0)">⬇️ Descargar PDF</button>'),
  '<button class="btn bg2" onclick="'+o.volver+'">‹ Volver</button><button class="btn bg2" onclick="cerrar()">Cerrar</button>')}
function lstPdf(i){return (i==null)?_pdfs.slice():(_pdfs[i]?[_pdfs[i]]:[])}
function descargarPdf(i){var l=lstPdf(i);if(!l.length)return;
 l.forEach(function(f,k){setTimeout(function(){var a=document.createElement("a");a.href=URL.createObjectURL(f.blob);a.download=f.nombre;
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},4000)},k*500)});toast("PDF descargado")}
function compartirPdf(i){var l=lstPdf(i);if(!l.length)return;
 var fs=l.map(function(f){return new File([f.blob],f.nombre,{type:"application/pdf"})});
 if(navigator.canShare&&navigator.canShare({files:fs}))navigator.share({files:fs,title:fs[0].name}).catch(function(e){if(e&&e.name!=="AbortError")descargarPdf(i)});
 else descargarPdf(i)}


/* ---------- Listado impreso ---------- */
function htmlListado(vId){
 var v=DB.viajes[vId];if(!v)return "";
 var uno=FPT!=="__all";
 var lista=paxArr(v).sort(function(a,b){return (a.ts||0)-(b.ts||0)}).filter(function(p){return filtra(p,v)});
 var pl=0,se=0,pe=0,i=0,filas="";
 lista.forEach(function(p){
  var vjs=viajeros(p),mx=mixto(p,v);
  var mios=uno?enPunto(p,FPT,v):vjs;
  if(!mios.length)return;
  var cm=cuenta(mios),n=cm.ad+cm.ni;pl+=n;
  var titAqui=mios.indexOf(vjs[0])>=0;
  var cobra=(!uno||titAqui);
  if(cobra){se+=(+p.senal||0);pe+=(+p.pendiente||0)}
  i++;
  var tit=titAqui?vjs[0]:mios[0];
  var resto=mios.filter(function(x){return x!==tit});
  var sp=splitSN(resto,!(mx&&!uno)),snt=snTxt(sp.sn);
  var ac=sp.named.map(function(x){return esc(x.nombre||"(sin nombre)")+
   (x.tipo==="nino"?" (niño"+(x.edad?" "+x.edad:"")+")":x.tipo==="bebe"?" (bebé)":"")+
   ((mx&&!uno)?" ["+esc(recDe(p,x,v))+"]":"")}).join(", ");
  if(snt)ac+=(ac?", ":"")+snt;
  filas+='<tr><td class="ce">'+i+'</td><td><div class="nm">'+esc(tit.nombre||"(sin nombre)")+
   ((mx&&!uno)?' ['+esc(recDe(p,tit,v))+']':"")+'</div>'+
   (ac?'<div class="ac">'+ac+'</div>':"")+
   (n===1?'<div class="so">» NO SENTAR SOLO «</div>':"")+
   (!titAqui?'<div class="so">Paga con '+esc(vjs[0].nombre)+' en '+esc(recDe(p,vjs[0],v))+'</div>':"")+
   '<div class="lc">'+esc(p.localizador||"")+(p.vendedor?" · vend: "+esc(p.vendedor):"")+'</div></td>'+
   '<td class="ce"><b>'+n+'</b>'+(cm.be?"<br>+"+cm.be+"b":"")+'</td>'+
   '<td>'+esc(p.tel||"—")+'</td>'+
   (uno?"":'<td>'+esc(mx?"varios":recBase(p,v))+'</td>')+
   '<td class="ce">'+(cobra?money(+p.senal||0):"—")+'</td>'+
   '<td class="pe">'+(cobra?money(+p.pendiente||0):"—")+'</td>'+
   '<td class="ce"><span class="sq"></span></td><td></td></tr>'});
 var vac=uno?Math.max(0,14-i):Math.max(0,6-i);
 for(var k=0;k<vac;k++){i++;filas+='<tr><td class="ce" style="color:#aaa">'+i+'</td><td></td><td></td><td></td>'+(uno?"":"<td></td>")+'<td></td><td></td><td class="ce"><span class="sq"></span></td><td></td></tr>'}
 var t=totViaje(v);
 var grids=busSel(v).map(function(b){
  var c='<div class="gr-h"><span>RECUENTO DE SUBIDA — '+b.n.toUpperCase()+' ('+b.cap+' plazas)</span><span>Tachar un número por cada pasajero que sube</span></div><table class="gr">';
  for(var x=1;x<=b.cap;){c+="<tr>";for(var y=0;y<33;y++){c+=x<=b.cap?"<td>"+x+"</td>":'<td style="background:#e6e9ef"></td>';x++}c+="</tr>"}
  return c+'</table><div class="fir"><span>TOTAL SUBIDOS: __________</span><span>Firma: ______________________</span><span>Hora real: __________</span></div>'}).join("");
 return '<div class="lst-h"><h1>'+esc((v.destino||"").toUpperCase())+' · '+esc(fmtLargo(v.fecha))+'</h1>'+
  '<div class="s1">'+MARCA+' · '+TELS+(v.regreso?' · Regreso desde '+esc(v.destino)+' '+esc(v.regreso):"")+(v.num?' · Viaje Nº '+v.num:"")+'</div>'+
  '<div class="s2">'+(uno?"RECOGIDA: "+esc(FPT).toUpperCase():"LISTADO COMPLETO")+(v.hora?' · SALIDA '+esc(v.hora):"")+' · '+pl+' PASAJEROS</div></div>'+
  '<div class="lst-i"><span>Conductor: __________ Matrícula: _________ Hora real: ______ · Presentación 15 min antes</span><span class="rr">» NO SENTAR SOLO « = sentar junto a otro pasajero</span></div>'+
  '<table class="lst"><thead><tr><th style="width:4%">Nº</th><th>NOMBRE(S)</th><th style="width:6%">PAX</th><th style="width:14%">TELÉFONO</th>'+
  (uno?"":'<th style="width:13%">RECOGIDA</th>')+
  '<th style="width:9%">SEÑAL</th><th style="width:10%">PDTE. €</th><th style="width:6%">SUBE</th><th style="width:11%">COBRADO</th></tr></thead>'+
  '<tbody>'+filas+'</tbody>'+
  '<tfoot><tr><td colspan="2">TOTALES</td><td class="ce">'+pl+'</td><td'+(uno?'':' colspan="2"')+'></td><td class="ce">'+money(se)+'</td><td class="pe">'+money(pe)+'</td><td colspan="2"></td></tr></tfoot></table>'+
  (t.cap?'<div style="font-size:9.5px;margin-top:5px">'+esc(busNames(v))+' — capacidad '+t.cap+' · ocupadas '+t.plazas+' · libres '+t.libres+'</div>':"")+grids}
function imprimir(vId){var h=htmlListado(vId);if(!h)return;document.getElementById("print-area").innerHTML=h;window.print()}
