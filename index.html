<style>
:root{--navy:#0D1F3C;--navy2:#16345f;--gold:#FFD400;--bg:#EEF3F8;--line:#DCE5EE;--muted:#5f7286;--green:#1E9E63;--greenbg:#E6F6EE;--amber:#B45309;--amberbg:#FFF4CC;--red:#E8323C}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif}
body{background:var(--bg);color:#12202f;padding-bottom:90px}
.top{background:var(--navy);color:#fff;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:20}
.top-in{max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 11px) 14px 11px;display:flex;align-items:center;gap:11px}
.top img{width:38px;height:38px;border-radius:50%;background:#fff}
.top b{font-size:15px;line-height:1.1}.top .s{font-size:10px;letter-spacing:1px;color:#AEC6DC;text-transform:uppercase}
.dot{margin-left:auto;width:10px;height:10px;border-radius:50%;background:#7CFAB8}.dot.off{background:#E8323C}
.wrap{max-width:760px;margin:0 auto;padding:14px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--navy);font-weight:800;font-size:14px;margin-bottom:10px;cursor:pointer}
h2{font-size:18px;margin:2px 2px 12px}
.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:11px;box-shadow:0 4px 16px -13px rgba(13,31,60,.5)}
.viaje{cursor:pointer}
.viaje .d{font-weight:800;font-size:16px}
.viaje .m{font-size:12.5px;color:var(--muted);margin-top:3px}
.mini{display:flex;gap:7px;margin-top:10px}
.mini>div{flex:1;background:var(--bg);border-radius:9px;padding:7px;text-align:center}
.mini b{font-size:15px;display:block}.mini small{font-size:9.5px;color:var(--muted);text-transform:uppercase}
.pax{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--line);border-radius:13px;margin-bottom:9px;background:#fff;transition:.15s}
.pax.emb{background:var(--greenbg);border-color:#9BD9B8}
.chk{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff;font-weight:800;background:#fff;cursor:pointer}
.pax.emb .chk{background:var(--green);border-color:var(--green)}
.pax .i{flex:1;min-width:0}.pax .n{font-weight:700;font-size:14px}.pax .mm{font-size:11.5px;color:var(--muted)}
.pax .r{text-align:right;flex-shrink:0}
.pax .eur{font-weight:800;font-size:14px;color:var(--amber)}
.pax.cob .eur{color:var(--muted);text-decoration:line-through;font-size:12px}
.pax .cob-lbl{font-size:9px;color:var(--green);font-weight:800;display:none}.pax.cob .cob-lbl{display:block}
.acts{display:flex;gap:5px;margin-top:6px}
.acts button{border:1px solid var(--line);background:#fff;border-radius:7px;font-size:11px;font-weight:800;padding:5px 8px;cursor:pointer;color:var(--navy)}
.pax.cob .acts .bc{background:var(--green);color:#fff;border-color:var(--green)}
.btn{border:none;font-weight:800;border-radius:12px;padding:14px;font-size:15px;cursor:pointer;width:100%}
.bp{background:var(--navy);color:#fff}.bg2{background:#fff;border:1.5px solid var(--line);color:var(--navy)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:30;background:var(--gold);color:var(--navy);font-weight:800;border:none;padding:15px 26px;border-radius:100px;box-shadow:0 12px 30px -8px rgba(13,31,60,.5);font-size:15px;cursor:pointer;max-width:calc(100% - 28px)}
.ov{position:fixed;inset:0;background:rgba(10,20,35,.6);z-index:40;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.ov.on{display:flex}
.sheet{background:#fff;width:100%;max-width:620px;max-height:94vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 20px)}
@media(min-width:620px){.ov{align-items:center}.sheet{border-radius:20px}}
label{display:block;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;margin:12px 0 5px}
input,select{width:100%;font-size:16px;padding:12px;border:1.5px solid var(--line);border-radius:11px;background:#fff}
.row2{display:flex;gap:10px}.row2>div{flex:1}
.qty{display:flex;align-items:center;gap:10px}.qty button{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:19px;font-weight:800}.qty input{text-align:center;font-weight:800}
.sumbox{background:var(--bg);border-radius:11px;padding:12px;margin-top:12px;font-size:14px}
.sumbox .r{display:flex;justify-content:space-between;padding:3px 0}.sumbox .big{font-weight:800;border-top:1px dashed var(--line);margin-top:5px;padding-top:6px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:11px;font-weight:600;font-size:14px;opacity:0;transition:.2s;z-index:60;pointer-events:none}
.toast.s{opacity:1;transform:translateX(-50%)}
.empty{text-align:center;color:var(--muted);padding:34px 16px;font-size:14px}
.hint{font-size:11px;color:var(--green);font-weight:700;margin-top:5px;min-height:14px}
.big-tot{display:flex;gap:8px;margin-bottom:12px}
.big-tot>div{flex:1;background:var(--navy2);color:#fff;border-radius:12px;padding:11px;text-align:center}
.big-tot b{font-size:19px;display:block}.big-tot small{font-size:10px;color:#AEC6DC;text-transform:uppercase}
#print-area{display:none;}
@media print{
  body>*:not(#print-area){display:none!important;}
  #print-area{display:block!important;padding:20px;font-family:Arial,sans-serif;color:#000;}
  #print-area h1{font-size:20px;margin:0 0 4px}
  #print-area .meta{font-size:13px;color:#333;margin-bottom:14px}
  #print-area table{width:100%;border-collapse:collapse;font-size:12px}
  #print-area th,#print-area td{border:1px solid #999;padding:6px 8px;text-align:left}
  #print-area th{background:#eee}
  #print-area tfoot td{font-weight:bold}
}

function esc(s){return (s||"").replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}
function normTel(t){if(!t)return"";let s=(""+t).replace(/\D/g,"");if(s.startsWith("34")&&s.length>9)s=s.slice(2);return s.slice(-9);}
function uid(p){return p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}

REF.on("value",s=>{DB=s.val()||{viajes:{}};if(!DB.viajes)DB.viajes={};document.getElementById("dot").classList.remove("off");render();},
  ()=>document.getElementById("dot").classList.add("off"));
function save(){return REF.set(DB).catch(()=>{toast("Error al guardar");document.getElementById("dot").classList.add("off");});}

function paxArr(v){return Object.values(v.pasajeros||{});}
function totViaje(v){const p=paxArr(v);
  const plazas=p.reduce((s,x)=>s+(+x.plazas||0),0);
  const emb=p.filter(x=>x.embarcado).reduce((s,x)=>s+(+x.plazas||0),0);
  const senal=p.reduce((s,x)=>s+(+x.senal||0),0);
  const pend=p.reduce((s,x)=>s+(+x.pendiente||0),0);
  const cobradoBus=p.filter(x=>x.cobrado).reduce((s,x)=>s+(+x.pendiente||0),0);
  const cobrado=senal+cobradoBus;
  return {plazas,emb,senal,pend,cobradoBus,cobrado,porcobrar:pend-cobradoBus,ngrupos:p.length};}

function render(){
  document.getElementById("fab").textContent = VIEW==="lista" ? "+ Nuevo viaje" : "+ Añadir pasajero";
  if(VIEW==="lista")renderLista(); else renderDetalle();
}
function renderLista(){
  const app=document.getElementById("app");
  const vs=Object.values(DB.viajes).sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
  app.innerHTML=`<h2>Viajes</h2>`+(vs.length?vs.map(v=>{
    const t=totViaje(v);
    return `<div class="card viaje" onclick="abrir('${v.id}')">
      <div class="d">🚌 ${esc(v.destino)}</div>
      <div class="m">${v.fecha?fmtF(v.fecha):"sin fecha"}${v.hora?" · "+esc(v.hora):""}${v.punto?" · "+esc(v.punto):""}</div>
      <div class="mini">
        <div><b>${t.emb}/${t.plazas}</b><small>Embarcados</small></div>
        <div><b>${money(t.cobrado)}</b><small>Cobrado</small></div>
        <div><b>${money(t.porcobrar)}</b><small>Por cobrar</small></div>
      </div></div>`;}).join("")
    : `<div class="empty">Aún no hay viajes.<br>Pulsa <b>+ Nuevo viaje</b> para crear el primero.</div>`);
}
function renderDetalle(){
  const v=DB.viajes[CUR]; if(!v){VIEW="lista";return render();}
  const t=totViaje(v);
  const app=document.getElementById("app");
  const pax=paxArr(v).sort((a,b)=>(a.ts||0)-(b.ts||0));
  app.innerHTML=`
    <button class="back" onclick="VIEW='lista';render()">‹ Viajes</button>
    <h2>🚌 ${esc(v.destino)}</h2>
    <div class="m" style="color:var(--muted);font-size:13px;margin:-8px 2px 12px">${v.fecha?fmtF(v.fecha):""}${v.hora?" · "+esc(v.hora):""}${v.punto?" · "+esc(v.punto):""} <a onclick="modalViaje('${v.id}')" style="color:var(--navy);font-weight:800;cursor:pointer">✏️ editar</a> · <a onclick="imprimirViaje('${v.id}')" style="color:var(--navy);font-weight:800;cursor:pointer">🖨️ Imprimir/PDF</a></div>
    <div class="big-tot">
      <div><b>${t.emb}/${t.plazas}</b><small>Embarcados</small></div>
      <div><b>${money(t.cobrado)}</b><small>Cobrado</small></div>
      <div><b>${money(t.porcobrar)}</b><small>Por cobrar</small></div>
    </div>
    ${pax.length?pax.map(p=>paxRow(v.id,p)).join(""):`<div class="empty">Sin pasajeros todavía.<br>Pulsa <b>+ Añadir pasajero</b>.</div>`}`;
}
function paxRow(vId,p){
  return `<div class="pax ${p.embarcado?'emb':''} ${p.cobrado?'cob':''}">
    <div class="chk" onclick="toggleEmb('${vId}','${p.id}')">${p.embarcado?"✓":""}</div>
    <div class="i" onclick="toggleEmb('${vId}','${p.id}')">
      <div class="n">${esc(p.nombre)||"(sin nombre)"}</div>
      <div class="mm">${p.plazas} plaza(s)${p.tel?" · "+esc(p.tel):""}${p.recogida?" · "+esc(p.recogida):""}${p.nota?" · "+esc(p.nota):""}</div>
      <div class="acts">
        <button class="bc" onclick="event.stopPropagation();toggleCob('${vId}','${p.id}')">${p.cobrado?"✓ Cobrado":"Cobrar "+(+p.pendiente||0)+"€"}</button>
        <button onclick="event.stopPropagation();modalPax('${vId}','${p.id}')">✏️</button>
        <button onclick="event.stopPropagation();delPax('${vId}','${p.id}')">🗑️</button>
      </div>
    </div>
    <div class="r"><div class="eur">${money(+p.pendiente||0)}</div><div class="cob-lbl">COBRADO</div></div>
  </div>`;
}
function fmtF(iso){if(!iso)return"";const[y,m,d]=iso.split("-");return d&&m?`${d}/${m}/${y}`:iso;}

function imprimirViaje(vId){
  const v=DB.viajes[vId]; if(!v)return;
  const pax=paxArr(v).sort((a,b)=>(a.ts||0)-(b.ts||0));
  const t=totViaje(v);
  const filas=pax.map(p=>`<tr>
    <td>${esc(p.nombre)||''}</td>
    <td>${p.plazas||0}</td>
    <td>${esc(p.tel||'')}</td>
    <td>${esc(p.recogida||'')}</td>
    <td>${money(+p.senal||0)}</td>
    <td>${money(+p.pendiente||0)}</td>
    <td>${p.embarcado?'Sí':'No'}</td>
  </tr>`).join('');
  document.getElementById('print-area').innerHTML=`
    <h1>${esc(v.destino)}</h1>
    <div class="meta">${v.fecha?fmtF(v.fecha):''}${v.hora?' · '+esc(v.hora):''}${v.punto?' · '+esc(v.punto):''}</div>
    <table>
      <thead><tr><th>Nombre</th><th>Plazas</th><th>Teléfono</th><th>Recogida</th><th>Señal</th><th>Pendiente</th><th>Embarcado</th></tr></thead>
      <tbody>${filas}</tbody>
      <tfoot><tr><td>TOTAL</td><td>${t.plazas}</td><td colspan="2"></td><td>${money(t.senal)}</td><td>${money(t.pend)}</td><td></td></tr></tfoot>
    </table>`;
  window.print();
}

function abrir(id){CUR=id;VIEW="detalle";render();}
function fabAction(){ VIEW==="lista"?modalViaje():modalPax(CUR); }

function toggleEmb(vId,pId){const p=DB.viajes[vId].pasajeros[pId];p.embarcado=!p.embarcado;save();render();}
function toggleCob(vId,pId){const p=DB.viajes[vId].pasajeros[pId];p.cobrado=!p.cobrado;save();render();}
function delPax(vId,pId){if(confirm("¿Eliminar pasajero?")){delete DB.viajes[vId].pasajeros[pId];save();render();}}

// ---- Modal viaje ----
function modalViaje(id){
  const v=id?DB.viajes[id]:{};
  document.getElementById("sheet").innerHTML=`
    <h2>${id?"Editar viaje":"Nuevo viaje"}</h2>
    <label>Destino</label><input id="v-dest" value="${esc(v.destino||'')}" placeholder="Ej. Benidorm">
    <div class="row2"><div><label>Fecha</label><input id="v-fecha" type="date" value="${v.fecha||''}"></div>
      <div><label>Hora salida</label><input id="v-hora" value="${esc(v.hora||'')}" placeholder="01:00"></div></div>
    <label>Punto de salida</label><input id="v-punto" value="${esc(v.punto||'')}" placeholder="Plaza Elíptica / Atocha…">
    <div class="row2"><div><label>Precio adulto €</label><input id="v-pa" type="number" inputmode="decimal" value="${v.precioA??''}" placeholder="55"></div>
      <div><label>Precio niño €</label><input id="v-pn" type="number" inputmode="decimal" value="${v.precioN??''}" placeholder="50"></div></div>
    <button class="btn bp" style="margin-top:16px" onclick="guardarViaje('${id||''}')">${id?"Guardar cambios":"Crear viaje"}</button>
    ${id?`<button class="btn bg2" style="margin-top:8px" onclick="delViaje('${id}')">🗑️ Eliminar viaje</button>`:''}
    <button class="btn bg2" style="margin-top:8px" onclick="cerrar()">Cancelar</button>`;
  abrirOv();
}
function guardarViaje(id){
  const dest=document.getElementById("v-dest").value.trim();
  if(!dest){toast("Pon el destino");return;}
  const vid=id||uid("v");
  const prev=id?DB.viajes[id]:{pasajeros:{}};
  DB.viajes[vid]={...prev,id:vid,destino:dest,
    fecha:document.getElementById("v-fecha").value,
    hora:document.getElementById("v-hora").value.trim(),
    punto:document.getElementById("v-punto").value.trim(),
    precioA:parseFloat(document.getElementById("v-pa").value)||0,
    precioN:parseFloat(document.getElementById("v-pn").value)||0,
    pasajeros:prev.pasajeros||{}};
  save();cerrar();if(!id){CUR=vid;VIEW="detalle";}render();toast(id?"Viaje actualizado":"Viaje creado");
}
function delViaje(id){if(confirm("¿Eliminar el viaje y todos sus pasajeros?")){delete DB.viajes[id];save();cerrar();VIEW="lista";render();toast("Viaje eliminado");}}

// ---- Modal pasajero ----
function modalPax(vId,pId){
  const v=DB.viajes[vId];const p=pId?v.pasajeros[pId]:{adultos:1,ninos:0,senal:0};
  document.getElementById("sheet").innerHTML=`
    <h2>${pId?"Editar pasajero":"Añadir pasajero"}</h2>
    <label>Nombre y apellidos</label><input id="p-nom" value="${esc(p.nombre||'')}" placeholder="Nombre del titular">
    <label>Teléfono</label><input id="p-tel" type="tel" value="${esc(p.tel||'')}" placeholder="6XX XXX XXX" oninput="autofill('${vId}')">
    <div class="hint" id="p-hint"></div>
    <div class="row2">
      <div><label>Adultos</label><div class="qty"><button onclick="stp('a',-1)">−</button><input id="p-ad" value="${p.adultos??1}" readonly><button onclick="stp('a',1)">＋</button></div></div>
      <div><label>Niños</label><div class="qty"><button onclick="stp('n',-1)">−</button><input id="p-ni" value="${p.ninos??0}" readonly><button onclick="stp('n',1)">＋</button></div></div>
    </div>
    <label>Punto de recogida</label><input id="p-rec" value="${esc(p.recogida||v.punto||'')}" placeholder="Elíptica / Atocha / Vallecas">
    <div class="row2">
      <div><label>Señal pagada €</label><input id="p-senal" type="number" inputmode="decimal" value="${p.senal??0}" oninput="calcPax('${vId}')"></div>
      <div><label>Nota</label><input id="p-nota" value="${esc(p.nota||'')}" placeholder="opcional"></div>
    </div>
    <div class="sumbox" id="p-sum"></div>
    <button class="btn bp" style="margin-top:14px" onclick="guardarPax('${vId}','${pId||''}')">${pId?"Guardar":"Añadir"}</button>
    <button class="btn bg2" style="margin-top:8px" onclick="cerrar()">Cancelar</button>`;
  abrirOv();calcPax(vId);
}
function stp(k,d){const el=document.getElementById(k==='a'?"p-ad":"p-ni");let n=(parseInt(el.value)||0)+d;n=Math.max(k==='a'?0:0,n);el.value=n;calcPax(CUR);}
function calcPax(vId){
  const v=DB.viajes[vId];
  const ad=parseInt(document.getElementById("p-ad").value)||0, ni=parseInt(document.getElementById("p-ni").value)||0;
  const total=ad*(+v.precioA||0)+ni*(+v.precioN||0);
  const senal=parseFloat(document.getElementById("p-senal").value)||0;
  const pend=Math.max(0,Math.round((total-senal)*100)/100);
  document.getElementById("p-sum").innerHTML=`
    <div class="r"><span>${ad} adulto(s) + ${ni} niño(s)</span><b>${money(total)}</b></div>
    <div class="r"><span>Señal pagada</span><span style="color:var(--green);font-weight:800">${money(senal)}</span></div>
    <div class="r big"><span>Pendiente (efectivo en bus)</span><span style="color:var(--amber)">${money(pend)}</span></div>`;
  window._pcalc={total,senal,pend,plazas:ad+ni,ad,ni};
}
function autofill(vId){
  const tel=normTel(document.getElementById("p-tel").value);
  const h=document.getElementById("p-hint");
  if(tel.length<6){h.textContent="";return;}
  let found=null;
  Object.values(DB.viajes).forEach(v=>Object.values(v.pasajeros||{}).forEach(p=>{if(normTel(p.tel)===tel&&p.nombre)found=p;}));
  if(found){h.textContent="✓ Cliente conocido: "+found.nombre;
    const nom=document.getElementById("p-nom");if(!nom.value)nom.value=found.nombre;}
  else h.textContent="";
}
function guardarPax(vId,pId){
  const v=DB.viajes[vId];
  calcPax(vId);const {senal,pend,plazas,ad,ni}=window._pcalc;
  if(plazas<1){toast("Añade al menos 1 plaza");return;}
  const id=pId||uid("p");
  const prev=pId?v.pasajeros[pId]:{};
  if(!v.pasajeros)v.pasajeros={};
  v.pasajeros[id]={...prev,id,nombre:document.getElementById("p-nom").value.trim(),
    tel:document.getElementById("p-tel").value.trim(),
    adultos:ad,ninos:ni,plazas,recogida:document.getElementById("p-rec").value.trim(),
    senal,pendiente:pend,nota:document.getElementById("p-nota").value.trim(),
    embarcado:prev.embarcado||false,cobrado:prev.cobrado||false,ts:prev.ts||Date.now()};
  save();cerrar();render();toast(pId?"Pasajero actualizado":"Pasajero añadido");
}

function abrirOv(){document.getElementById("ov").classList.add("on");}
function cerrar(){document.getElementById("ov").classList.remove("on");}
document.getElementById("ov").addEventListener("click",e=>{if(e.target.id==="ov")cerrar();});
</script></body></html>
