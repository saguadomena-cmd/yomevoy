<!DOCTYPE html><html lang="es"><head>

<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" href="logo.png">

<meta name="apple-mobile-web-app-title" content="Embarque">
<meta name="theme-color" content="#0D1F3C">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{--navy:#0D1F3C;--navy2:#16345f;--gold:#FFD400;--bg:#EEF3F8;--line:#DCE5EE;--muted:#5f7286;--green:#1E9E63;--greenbg:#E6F6EE;--amber:#B45309;--amberbg:#FFF4CC;--red:#E8323C;--rose:#D81B60}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif}
body{background:var(--bg);color:#12202f;padding-bottom:96px}
.top{background:var(--navy);color:#fff;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:20}
.top-in{max-width:820px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 11px) 14px 11px;display:flex;align-items:center;gap:11px}
.top img{width:38px;height:38px;border-radius:9px;background:#fff}
.top b{font-size:15px;line-height:1.1}.top .s{font-size:10px;letter-spacing:1px;color:#AEC6DC;text-transform:uppercase}
.dot{margin-left:auto;width:10px;height:10px;border-radius:50%;background:#7CFAB8}.dot.off{background:#E8323C}
.wrap{max-width:820px;margin:0 auto;padding:14px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--navy);font-weight:800;font-size:14px;margin-bottom:10px;cursor:pointer}
h2{font-size:18px;margin:2px 2px 12px}
.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:11px;box-shadow:0 4px 16px -13px rgba(13,31,60,.5)}
.viaje{cursor:pointer}.viaje .d{font-weight:800;font-size:16px}
.viaje .m{font-size:12.5px;color:var(--muted);margin-top:3px}
.mini{display:flex;gap:7px;margin-top:10px}
.mini>div{flex:1;background:var(--bg);border-radius:9px;padding:7px;text-align:center}
.mini b{font-size:15px;display:block}.mini small{font-size:9.5px;color:var(--muted);text-transform:uppercase}
.cap{margin-top:10px;background:var(--bg);border-radius:10px;padding:9px 11px}
.cap .hd{display:flex;justify-content:space-between;font-size:12px;font-weight:800;margin-bottom:6px}
.bar{height:9px;border-radius:6px;background:#d7e0ea;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);transition:.3s}
.bar.warn i{background:var(--amber)}.bar.full i{background:var(--red)}
.cap .bl{font-size:11px;color:var(--muted);margin-top:5px}
.pax{display:flex;align-items:flex-start;gap:11px;padding:11px 12px;border:1px solid var(--line);border-radius:13px;margin-bottom:9px;background:#fff}
.pax.emb{background:var(--greenbg);border-color:#9BD9B8}
.chk{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff;font-weight:800;background:#fff;cursor:pointer;margin-top:2px}
.pax.emb .chk{background:var(--green);border-color:var(--green)}
.pax .i{flex:1;min-width:0}.pax .n{font-weight:800;font-size:14.5px}
.pax .acom{font-size:12px;color:#3d4f63;margin-top:2px;line-height:1.45}
.pax .mm{font-size:11.5px;color:var(--muted);margin-top:3px}
.pax .r{text-align:right;flex-shrink:0}
.pax .eur{font-weight:800;font-size:14px;color:var(--amber)}
.pax.cob .eur{color:var(--muted);text-decoration:line-through;font-size:12px}
.pax .cob-lbl{font-size:9px;color:var(--green);font-weight:800;display:none}.pax.cob .cob-lbl{display:block}
.tag{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:20px;background:#eaf0f7;color:var(--navy);margin-right:4px}
.tag.n{background:#FFF1D6;color:var(--amber)}.tag.b{background:#F3E6F7;color:#7B1FA2}
.tag.solo{background:#FDE7EF;color:var(--rose)}
.acts{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.acts button{border:1px solid var(--line);background:#fff;border-radius:8px;font-size:11.5px;font-weight:800;padding:6px 9px;cursor:pointer;color:var(--navy)}
.acts .tel{background:var(--navy);color:#fff;border-color:var(--navy)}
.pax.cob .acts .bc{background:var(--green);color:#fff;border-color:var(--green)}
.btn{border:none;font-weight:800;border-radius:12px;padding:14px;font-size:15px;cursor:pointer;width:100%}
.bp{background:var(--navy);color:#fff}.bg2{background:#fff;border:1.5px solid var(--line);color:var(--navy)}
.bdel{background:#fff;border:1.5px solid #f3c4c8;color:var(--red)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:30;background:var(--gold);color:var(--navy);font-weight:800;border:none;padding:15px 26px;border-radius:100px;box-shadow:0 12px 30px -8px rgba(13,31,60,.5);font-size:15px;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(10,20,35,.6);z-index:40;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.ov.on{display:flex}
.sheet{background:#fff;width:100%;max-width:640px;max-height:94vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 20px)}
@media(min-width:640px){.ov{align-items:center}.sheet{border-radius:20px}}
label{display:block;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;margin:12px 0 5px}
input,select{width:100%;font-size:16px;padding:12px;border:1.5px solid var(--line);border-radius:11px;background:#fff}
.row2{display:flex;gap:10px}.row2>div{flex:1}
.sumbox{background:var(--bg);border-radius:11px;padding:12px;margin-top:12px;font-size:14px}
.sumbox .r{display:flex;justify-content:space-between;padding:3px 0}
.sumbox .big{font-weight:800;border-top:1px dashed var(--line);margin-top:5px;padding-top:6px}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:11px;font-weight:600;font-size:14px;opacity:0;transition:.2s;z-index:60;pointer-events:none;max-width:90%;text-align:center}
.toast.s{opacity:1;transform:translateX(-50%)}
.empty{text-align:center;color:var(--muted);padding:34px 16px;font-size:14px}
.hint{font-size:11px;color:var(--green);font-weight:700;margin-top:5px;min-height:14px}
.big-tot{display:flex;gap:8px;margin-bottom:10px}
.big-tot>div{flex:1;background:var(--navy2);color:#fff;border-radius:12px;padding:11px;text-align:center}
.big-tot b{font-size:19px;display:block}.big-tot small{font-size:10px;color:#AEC6DC;text-transform:uppercase}
.search{display:flex;gap:8px;margin-bottom:10px}
.search input{flex:1;padding:11px 13px}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.chip{white-space:nowrap;border:1.5px solid var(--line);background:#fff;color:var(--navy);border-radius:100px;padding:8px 14px;font-size:12.5px;font-weight:800;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.buses{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.busop{display:flex;align-items:center;gap:11px;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;background:#fff}
.busop.on{border-color:var(--navy);background:#f2f6fb}
.busop .bx{width:24px;height:24px;border-radius:6px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;flex-shrink:0}
.busop.on .bx{background:var(--navy);border-color:var(--navy)}
.busop b{font-size:14px}.busop small{display:block;color:var(--muted);font-size:11.5px;font-weight:600}
.vrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.vrow input.nm{flex:1}
.vrow select{width:104px;flex-shrink:0;padding:11px 8px;font-size:14px}
.vrow input.ed{width:62px;flex-shrink:0;text-align:center}
.vrow .x{width:38px;height:44px;flex-shrink:0;border:1.5px solid var(--line);background:#fff;border-radius:10px;color:var(--red);font-size:17px;font-weight:800;cursor:pointer}
.addv{border:1.5px dashed var(--line);background:#fff;color:var(--navy);border-radius:11px;padding:11px;font-weight:800;font-size:13.5px;width:100%;cursor:pointer;margin-top:2px}
.titu{font-size:10.5px;font-weight:800;color:var(--gold);background:var(--navy);border-radius:5px;padding:2px 6px;margin-right:5px}
#print-area{display:none}
@media print{
 body>*:not(#print-area){display:none!important}
 #print-area{display:block!important;padding:14px;font-family:Arial,sans-serif;color:#000}
 #print-area h1{font-size:19px;margin:0 0 3px}
 #print-area .meta{font-size:12px;color:#333;margin-bottom:5px}
 #print-area .buses-p{font-size:12px;margin-bottom:10px;font-weight:bold}
 #print-area table{width:100%;border-collapse:collapse;font-size:11px}
 #print-area th,#print-area td{border:1px solid #999;padding:5px 6px;text-align:left;vertical-align:top}
 #print-area th{background:#e8edf3}
 #print-area tfoot td{font-weight:bold;background:#f4f7fa}
 #print-area .acp{color:#333;font-size:10px}
 #print-area .sq{display:inline-block;width:11px;height:11px;border:1.3px solid #333}
 tr{page-break-inside:avoid}
}
</style></head><body>
<header class="top"><div class="top-in">
 <img src="logo.png" alt="" onerror="this.style.display='none'">
 <div><b>Gestor de Embarque</b><div class="s">Yo Me Voy Excursiones</div></div>
 <div class="dot" id="dot" title="Conexión"></div>
</div></header>
<div class="wrap" id="app"></div>
<button class="fab" id="fab" onclick="fabAction()">+ Nuevo viaje</button>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div id="print-area"></div>
<script>
firebase.initializeApp({apiKey:"AIzaSyDI2vdwTHZxAbfw1HRim4S3QsH1yEygHtw",authDomain:"yo-me-voy-reservas.firebaseapp.com",databaseURL:"https://yo-me-voy-reservas-default-rtdb.europe-west1.firebasedatabase.app",projectId:"yo-me-voy-reservas",storageBucket:"yo-me-voy-reservas.firebasestorage.app",messagingSenderId:"250466590178",appId:"1:250466590178:web:e1d916ce49be57bd592dbb"});
var REF=firebase.database().ref("gestor_embarque");
var DB={viajes:{}},VIEW="lista",CUR=null,Q="",FPT="__all";
var BUSES=[{id:"b97",n:"Bus grande",cap:97},{id:"b84",n:"Bus mediano",cap:84},{id:"b60a",n:"Bus pequeño A",cap:60},{id:"b60b",n:"Bus pequeño B",cap:60}];
var tt;function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("s");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("s")},2400)}
function money(n){return (Math.round(n*100)/100)+" €"}
function esc(s){return (s||"").replace(/[<>&"]/g,function(c){return {"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]})}
function normTel(t){if(!t)return"";var s=(""+t).replace(/\D/g,"");if(s.indexOf("34")===0&&s.length>9)s=s.slice(2);return s.slice(-9)}
function uid(p){return p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function fmtF(iso){if(!iso)return"";var a=iso.split("-");return a[2]?a[2]+"/"+a[1]+"/"+a[0]:iso}

/* ---------- Firebase: lectura en tiempo real + escrituras parciales ---------- */
REF.on("value",function(s){DB=s.val()||{viajes:{}};if(!DB.viajes)DB.viajes={};document.getElementById("dot").classList.remove("off");render()},
 function(){document.getElementById("dot").classList.add("off")});
function fail(){toast("Sin conexión: cambio no guardado");document.getElementById("dot").classList.add("off")}
function wViaje(v){var c=Object.assign({},v);delete c.pasajeros;return REF.child("viajes/"+v.id).update(c).catch(fail)}
function wPax(vId,p){return REF.child("viajes/"+vId+"/pasajeros/"+p.id).update(p).catch(fail)}
function wField(path,val){return REF.child(path).set(val).catch(fail)}
function wDel(path){return REF.child(path).remove().catch(fail)}

/* ---------- Cálculos ---------- */
function viajeros(p){
 if(p.viajeros&&p.viajeros.length)return p.viajeros;
 var a=[];var n=(p.nombre||"").trim();
 if(n)a.push({nombre:n,tipo:"adulto",edad:""});
 for(var i=1;i<(+p.adultos||0);i++)a.push({nombre:"",tipo:"adulto",edad:""});
 for(var j=0;j<(+p.ninos||0);j++)a.push({nombre:"",tipo:"nino",edad:""});
 return a;
}
function cuenta(vjs){var r={ad:0,ni:0,be:0};for(var i=0;i<vjs.length;i++){var t=vjs[i].tipo;if(t==="nino")r.ni++;else if(t==="bebe")r.be++;else r.ad++}return r}
function importe(v,vjs){var c=cuenta(vjs);return c.ad*(+v.precioA||0)+c.ni*(+v.precioN||+v.precioA||0)}
function plazasDe(p){var c=cuenta(viajeros(p));return c.ad+c.ni}
function paxArr(v){var o=v.pasajeros||{};return Object.keys(o).map(function(k){return o[k]})}
function capacidad(v){var t=0;(BUSES).forEach(function(b){if(v.buses&&v.buses[b.id])t+=b.cap});return t}
function busNames(v){return BUSES.filter(function(b){return v.buses&&v.buses[b.id]}).map(function(b){return b.n+" ("+b.cap+")"}).join(" + ")}
function totViaje(v){
 var p=paxArr(v),plazas=0,emb=0,senal=0,pend=0,cobBus=0,solos=0,be=0;
 p.forEach(function(x){var pl=plazasDe(x);plazas+=pl;if(x.embarcado)emb+=pl;
  senal+=(+x.senal||0);pend+=(+x.pendiente||0);if(x.cobrado)cobBus+=(+x.pendiente||0);
  if(pl===1)solos++;be+=cuenta(viajeros(x)).be});
 var cap=capacidad(v);
 return {plazas:plazas,emb:emb,senal:senal,pend:pend,cobBus:cobBus,cobrado:senal+cobBus,
  porcobrar:pend-cobBus,ngrupos:p.length,cap:cap,libres:cap-plazas,solos:solos,bebes:be};
}

/* ---------- Render ---------- */
function render(){document.getElementById("fab").textContent=VIEW==="lista"?"+ Nuevo viaje":"+ Añadir pasajero";
 if(VIEW==="lista")renderLista();else renderDetalle()}

function renderLista(){
 var vs=Object.keys(DB.viajes).map(function(k){return DB.viajes[k]}).sort(function(a,b){return (b.fecha||"").localeCompare(a.fecha||"")});
 var h='<h2>Viajes</h2>';
 h+=vs.length?vs.map(function(v){
  var t=totViaje(v);
  var barra=t.cap?'<div class="cap"><div class="hd"><span>'+t.plazas+' / '+t.cap+' plazas</span><span style="color:'+(t.libres<0?"var(--red)":t.libres<=5?"var(--amber)":"var(--green)")+'">'+(t.libres<0?"SOBREVENTA "+Math.abs(t.libres):t.libres+" libres")+'</span></div><div class="bar '+(t.libres<0?"full":t.libres<=5?"warn":"")+'"><i style="width:'+Math.min(100,t.cap?t.plazas/t.cap*100:0)+'%"></i></div><div class="bl">'+esc(busNames(v))+'</div></div>':'<div class="cap"><div class="bl">⚠️ Sin autobús asignado — pulsa el viaje y elige el bus</div></div>';
  return '<div class="card viaje" onclick="abrir(\''+v.id+'\')"><div class="d">🚌 '+esc(v.destino)+'</div>'+
   '<div class="m">'+(v.fecha?fmtF(v.fecha):"sin fecha")+(v.hora?" · "+esc(v.hora):"")+(v.punto?" · "+esc(v.punto):"")+'</div>'+
   '<div class="mini"><div><b>'+t.emb+'/'+t.plazas+'</b><small>Embarcados</small></div>'+
   '<div><b>'+money(t.cobrado)+'</b><small>Cobrado</small></div>'+
   '<div><b>'+money(t.porcobrar)+'</b><small>Por cobrar</small></div></div>'+barra+'</div>'}).join("")
  :'<div class="empty">Aún no hay viajes.<br>Pulsa <b>+ Nuevo viaje</b> para crear el primero.</div>';
 document.getElementById("app").innerHTML=h;
}

function puntosDe(v){var s={},a=[];paxArr(v).forEach(function(p){var r=(p.recogida||"").trim()||"(sin punto)";if(!s[r]){s[r]=1;a.push(r)}});return a.sort()}

function renderDetalle(){
 var v=DB.viajes[CUR];if(!v){VIEW="lista";return render()}
 var t=totViaje(v),pts=puntosDe(v);
 var lista=paxArr(v).sort(function(a,b){return (a.ts||0)-(b.ts||0)}).filter(function(p){return filtra(p)});
 var h='<button class="back" onclick="VIEW=\'lista\';Q=\'\';FPT=\'__all\';render()">‹ Viajes</button>';
 h+='<h2>🚌 '+esc(v.destino)+'</h2>';
 h+='<div style="color:var(--muted);font-size:13px;margin:-8px 2px 12px">'+(v.fecha?fmtF(v.fecha):"")+(v.hora?" · "+esc(v.hora):"")+(v.punto?" · "+esc(v.punto):"")+
    ' · <a onclick="modalViaje(\''+v.id+'\')" style="color:var(--navy);font-weight:800;cursor:pointer">✏️ editar</a></div>';
 h+='<div class="big-tot"><div><b>'+t.emb+'/'+t.plazas+'</b><small>Embarcados</small></div>'+
    '<div><b>'+money(t.cobrado)+'</b><small>Cobrado</small></div>'+
    '<div><b>'+money(t.porcobrar)+'</b><small>Por cobrar</small></div></div>';
 h+=t.cap?'<div class="card" style="padding:12px"><div class="hd" style="display:flex;justify-content:space-between;font-size:13px;font-weight:800;margin-bottom:7px"><span>Ocupación: '+t.plazas+' / '+t.cap+'</span><span style="color:'+(t.libres<0?"var(--red)":t.libres<=5?"var(--amber)":"var(--green)")+'">'+(t.libres<0?"SOBREVENTA de "+Math.abs(t.libres):t.libres+" plazas libres")+'</span></div><div class="bar '+(t.libres<0?"full":t.libres<=5?"warn":"")+'"><i style="width:'+Math.min(100,t.plazas/t.cap*100)+'%"></i></div><div class="bl" style="font-size:11.5px;color:var(--muted);margin-top:6px">'+esc(busNames(v))+(t.bebes?" · "+t.bebes+" bebé(s) en brazos sin plaza":"")+'</div></div>'
  :'<div class="card" style="padding:12px;border-color:#f0d7a8;background:#FFF9EA"><b style="font-size:13px">⚠️ Este viaje no tiene autobús asignado.</b><div style="font-size:12px;color:var(--muted);margin-top:4px">Pulsa <b>editar</b> y elige el bus para controlar las plazas libres.</div></div>';
 h+='<div class="search"><input id="q" placeholder="🔍 Buscar por nombre, acompañante o teléfono" value="'+esc(Q)+'" oninput="Q=this.value;renderDetalle();document.getElementById(\'q\').focus()"></div>';
 h+='<div class="chips"><div class="chip '+(FPT==="__all"?"on":"")+'" onclick="FPT=\'__all\';renderDetalle()">Todos ('+t.plazas+')</div>';
 pts.forEach(function(r){var n=paxArr(v).filter(function(p){return ((p.recogida||"").trim()||"(sin punto)")===r}).reduce(function(s,p){return s+plazasDe(p)},0);
  h+='<div class="chip '+(FPT===r?"on":"")+'" onclick="FPT=\''+esc(r).replace(/'/g,"")+'\';renderDetalle()">'+esc(r)+' ('+n+')</div>'});
 h+='</div>';
 h+='<button class="btn bg2" style="margin-bottom:12px" onclick="imprimir(\''+v.id+'\')">🖨️ Imprimir listado '+(FPT==="__all"?"completo":"de "+esc(FPT))+'</button>';
 h+=lista.length?lista.map(function(p){return paxRow(v.id,p)}).join(""):'<div class="empty">Ningún pasajero coincide con la búsqueda.</div>';
 document.getElementById("app").innerHTML=h;
}
function filtra(p){
 if(FPT!=="__all"&&(((p.recogida||"").trim()||"(sin punto)")!==FPT))return false;
 if(!Q)return true;
 var q=Q.toLowerCase();
 if((p.nombre||"").toLowerCase().indexOf(q)>=0)return true;
 if((p.tel||"").replace(/\D/g,"").indexOf(q.replace(/\D/g,""))>=0&&q.replace(/\D/g,""))return true;
 return viajeros(p).some(function(x){return (x.nombre||"").toLowerCase().indexOf(q)>=0});
}
function paxRow(vId,p){
 var vjs=viajeros(p),c=cuenta(vjs),pl=c.ad+c.ni;
 var acom=vjs.slice(1).map(function(x){
   var tg=x.tipo==="nino"?'<span class="tag n">niño'+(x.edad?" "+x.edad+"a":"")+'</span>':x.tipo==="bebe"?'<span class="tag b">bebé</span>':"";
   return tg+esc(x.nombre||"(sin nombre)")}).join(" · ");
 var tel=normTel(p.tel);
 return '<div class="pax '+(p.embarcado?"emb":"")+' '+(p.cobrado?"cob":"")+'">'+
  '<div class="chk" onclick="toggleEmb(\''+vId+'\',\''+p.id+'\')">'+(p.embarcado?"✓":"")+'</div>'+
  '<div class="i"><div class="n"><span class="titu">TITULAR</span>'+esc(vjs[0]?vjs[0].nombre:p.nombre)+'</div>'+
  (acom?'<div class="acom">'+acom+'</div>':"")+
  '<div class="mm">'+pl+' plaza(s)'+(c.be?" + "+c.be+" bebé":"")+(p.recogida?" · "+esc(p.recogida):"")+(pl===1?' <span class="tag solo">no sentar solo</span>':"")+(p.nota?" · "+esc(p.nota):"")+'</div>'+
  '<div class="acts">'+
   (tel?'<button class="tel" onclick="event.stopPropagation();menuTel(\''+tel+'\',\''+esc(vjs[0]?vjs[0].nombre:p.nombre).replace(/'/g,"")+'\')">📞 '+esc(p.tel)+'</button>':'<button onclick="event.stopPropagation();modalPax(\''+vId+'\',\''+p.id+'\')">📞 sin teléfono</button>')+
   '<button class="bc" onclick="event.stopPropagation();toggleCob(\''+vId+'\',\''+p.id+'\')">'+(p.cobrado?"✓ Cobrado":"Cobrar "+(+p.pendiente||0)+"€")+'</button>'+
   '<button onclick="event.stopPropagation();modalPax(\''+vId+'\',\''+p.id+'\')">✏️</button>'+
   '<button onclick="event.stopPropagation();delPax(\''+vId+'\',\''+p.id+'\')">🗑️</button></div></div>'+
  '<div class="r"><div class="eur">'+money(+p.pendiente||0)+'</div><div class="cob-lbl">COBRADO</div></div></div>';
}

/* ---------- Teléfono ---------- */
function menuTel(tel,nombre){
 var wa="https://wa.me/34"+tel+"?text="+encodeURIComponent("Hola "+nombre+", te escribo de Viaja Con Sergio sobre tu reserva.");
 document.getElementById("sheet").innerHTML='<h2>'+esc(nombre)+'</h2>'+
  '<div style="font-size:22px;font-weight:800;margin:6px 2px 16px">'+tel+'</div>'+
  '<a class="btn bp" style="display:block;text-align:center;text-decoration:none;margin-bottom:9px" href="tel:+34'+tel+'">📞 Llamar</a>'+
  '<a class="btn" style="display:block;text-align:center;text-decoration:none;background:#25D366;color:#fff;margin-bottom:9px" href="'+wa+'" target="_blank" rel="noopener">💬 Enviar WhatsApp</a>'+
  '<button class="btn bg2" onclick="copiar(\''+tel+'\')">📋 Copiar número</button>'+
  '<button class="btn bg2" style="margin-top:9px" onclick="cerrar()">Cerrar</button>';
 abrirOv();
}
function copiar(t){if(navigator.clipboard)navigator.clipboard.writeText(t);toast("Número copiado");cerrar()}

/* ---------- Acciones rápidas ---------- */
function abrir(id){CUR=id;VIEW="detalle";Q="";FPT="__all";render()}
function fabAction(){VIEW==="lista"?modalViaje():modalPax(CUR)}
function toggleEmb(vId,pId){var p=DB.viajes[vId].pasajeros[pId];p.embarcado=!p.embarcado;wField("viajes/"+vId+"/pasajeros/"+pId+"/embarcado",p.embarcado);render()}
function toggleCob(vId,pId){var p=DB.viajes[vId].pasajeros[pId];p.cobrado=!p.cobrado;wField("viajes/"+vId+"/pasajeros/"+pId+"/cobrado",p.cobrado);render()}
function delPax(vId,pId){if(confirm("¿Eliminar esta reserva?")){delete DB.viajes[vId].pasajeros[pId];wDel("viajes/"+vId+"/pasajeros/"+pId);render()}}

/* ---------- Modal viaje ---------- */
function modalViaje(id){
 var v=id?DB.viajes[id]:{buses:{}};var b=v.buses||{};
 var ops=BUSES.map(function(x){return '<div class="busop '+(b[x.id]?"on":"")+'" id="bo_'+x.id+'" onclick="togBus(\''+x.id+'\')"><div class="bx">'+(b[x.id]?"✓":"")+'</div><div><b>'+x.n+'</b><small>'+x.cap+' plazas</small></div></div>'}).join("");
 document.getElementById("sheet").innerHTML='<h2>'+(id?"Editar viaje":"Nuevo viaje")+'</h2>'+
  '<label>Destino</label><input id="v-dest" value="'+esc(v.destino||"")+'" placeholder="Ej. Benidorm">'+
  '<div class="row2"><div><label>Fecha</label><input id="v-fecha" type="date" value="'+(v.fecha||"")+'"></div>'+
  '<div><label>Hora salida</label><input id="v-hora" value="'+esc(v.hora||"")+'" placeholder="01:20"></div></div>'+
  '<label>Punto de salida principal</label><input id="v-punto" value="'+esc(v.punto||"")+'" placeholder="Plaza Elíptica / Atocha…">'+
  '<div class="row2"><div><label>Precio adulto €</label><input id="v-pa" type="number" inputmode="decimal" value="'+(v.precioA!=null?v.precioA:"")+'" placeholder="55"></div>'+
  '<div><label>Precio niño €</label><input id="v-pn" type="number" inputmode="decimal" value="'+(v.precioN!=null?v.precioN:"")+'" placeholder="50"></div></div>'+
  '<label>Autobús / autobuses del viaje</label><div class="buses">'+ops+'</div>'+
  '<div id="capinfo" style="font-size:13px;font-weight:800;margin-top:9px;color:var(--navy)"></div>'+
  '<button class="btn bp" style="margin-top:16px" onclick="guardarViaje(\''+(id||"")+'\')">'+(id?"Guardar cambios":"Crear viaje")+'</button>'+
  (id?'<button class="btn bdel" style="margin-top:8px" onclick="delViaje(\''+id+'\')">🗑️ Eliminar viaje</button>':"")+
  '<button class="btn bg2" style="margin-top:8px" onclick="cerrar()">Cancelar</button>';
 window._bus=Object.assign({},b);abrirOv();capInfo();
}
function togBus(id){window._bus[id]=!window._bus[id];var el=document.getElementById("bo_"+id);
 el.classList.toggle("on",!!window._bus[id]);el.querySelector(".bx").textContent=window._bus[id]?"✓":"";capInfo()}
function capInfo(){var t=0;BUSES.forEach(function(b){if(window._bus[b.id])t+=b.cap});
 document.getElementById("capinfo").textContent=t?"Capacidad total: "+t+" plazas":"Sin autobús seleccionado"}
function guardarViaje(id){
 var dest=document.getElementById("v-dest").value.trim();
 if(!dest){toast("Pon el destino");return}
 var pa=parseFloat(document.getElementById("v-pa").value)||0;
 var pnv=document.getElementById("v-pn").value;
 var pn=pnv===""?pa:(parseFloat(pnv)||0);
 var vid=id||uid("v");
 var v={id:vid,destino:dest,fecha:document.getElementById("v-fecha").value,
  hora:document.getElementById("v-hora").value.trim(),
  punto:document.getElementById("v-punto").value.trim(),
  precioA:pa,precioN:pn,buses:Object.assign({},window._bus)};
 if(!DB.viajes[vid])DB.viajes[vid]=Object.assign({pasajeros:{}},v);
 else Object.assign(DB.viajes[vid],v);
 wViaje(v);
 /* recalcula importes de los pasajeros ya metidos con los precios nuevos */
 if(id){var vv=DB.viajes[vid],n=0;
  paxArr(vv).forEach(function(p){var tot=importe(vv,viajeros(p));
   var pend=Math.max(0,Math.round((tot-(+p.senal||0))*100)/100);
   if(pend!==(+p.pendiente||0)){p.pendiente=pend;wField("viajes/"+vid+"/pasajeros/"+p.id+"/pendiente",pend);n++}});
  if(n)toast("Recalculados "+n+" importes con los precios nuevos")}
 cerrar();if(!id){CUR=vid;VIEW="detalle"}render();
}
function delViaje(id){if(confirm("¿Eliminar el viaje y TODOS sus pasajeros?")){delete DB.viajes[id];wDel("viajes/"+id);cerrar();VIEW="lista";render();toast("Viaje eliminado")}}

/* ---------- Modal pasajero ---------- */
function modalPax(vId,pId){
 var v=DB.viajes[vId];var p=pId?v.pasajeros[pId]:{senal:0};
 window._vj=JSON.parse(JSON.stringify(viajeros(p)));
 if(!window._vj.length)window._vj=[{nombre:"",tipo:"adulto",edad:""}];
 window._vid=vId;
 document.getElementById("sheet").innerHTML='<h2>'+(pId?"Editar reserva":"Nueva reserva")+'</h2>'+
  '<label>Titular y acompañantes</label><div id="vjs"></div>'+
  '<button class="addv" onclick="addV()">+ Añadir acompañante</button>'+
  '<label>Teléfono</label><input id="p-tel" type="tel" value="'+esc(p.tel||"")+'" placeholder="6XX XXX XXX" oninput="autofill()">'+
  '<div class="hint" id="p-hint"></div>'+
  '<label>Punto de recogida</label><input id="p-rec" value="'+esc(p.recogida||v.punto||"")+'" placeholder="Elíptica / Atocha / Vallecas">'+
  '<div class="row2"><div><label>Señal pagada €</label><input id="p-senal" type="number" inputmode="decimal" value="'+(p.senal!=null?p.senal:0)+'" oninput="calcPax()"></div>'+
  '<div><label>Nota</label><input id="p-nota" value="'+esc(p.nota||"")+'" placeholder="opcional"></div></div>'+
  '<div class="sumbox" id="p-sum"></div>'+
  '<button class="btn bp" style="margin-top:14px" onclick="guardarPax(\''+vId+'\',\''+(pId||"")+'\')">'+(pId?"Guardar":"Añadir")+'</button>'+
  '<button class="btn bg2" style="margin-top:8px" onclick="cerrar()">Cancelar</button>';
 abrirOv();pintaV();
}
function pintaV(){
 var h=window._vj.map(function(x,i){
  return '<div class="vrow">'+
   '<input class="nm" value="'+esc(x.nombre)+'" placeholder="'+(i===0?"Nombre del titular":"Nombre del acompañante")+'" oninput="setV('+i+',\'nombre\',this.value)">'+
   '<select onchange="setV('+i+',\'tipo\',this.value)"><option value="adulto"'+(x.tipo==="adulto"?" selected":"")+'>Adulto</option><option value="nino"'+(x.tipo==="nino"?" selected":"")+'>Niño</option><option value="bebe"'+(x.tipo==="bebe"?" selected":"")+'>Bebé</option></select>'+
   (x.tipo==="nino"||x.tipo==="bebe"?'<input class="ed" inputmode="numeric" value="'+esc(x.edad)+'" placeholder="edad" oninput="setV('+i+',\'edad\',this.value)">':"")+
   (i>0?'<button class="x" onclick="delV('+i+')">✕</button>':"")+'</div>'}).join("");
 document.getElementById("vjs").innerHTML=h;calcPax();
}
function setV(i,k,val){window._vj[i][k]=val;if(k==="tipo")pintaV();else calcPax()}
function addV(){window._vj.push({nombre:"",tipo:"adulto",edad:""});pintaV()}
function delV(i){window._vj.splice(i,1);pintaV()}
function calcPax(){
 var v=DB.viajes[window._vid];var c=cuenta(window._vj);
 var pnv=(v.precioN!=null&&v.precioN!=="")?+v.precioN:+v.precioA||0;
 var total=c.ad*(+v.precioA||0)+c.ni*pnv;
 var senal=parseFloat(document.getElementById("p-senal").value)||0;
 var pend=Math.max(0,Math.round((total-senal)*100)/100);
 var t=totViaje(v);var pl=c.ad+c.ni;
 var aviso=t.cap&&(t.plazas+pl)>t.cap?'<div class="r" style="color:var(--red);font-weight:800">⚠️ Supera la capacidad del bus ('+t.cap+')</div>':"";
 document.getElementById("p-sum").innerHTML=
  '<div class="r"><span>'+c.ad+' adulto(s) + '+c.ni+' niño(s)'+(c.be?" + "+c.be+" bebé(s)":"")+'</span><b>'+money(total)+'</b></div>'+
  '<div class="r"><span>Ocupa '+pl+' plaza(s)'+(c.be?" (bebés en brazos, sin plaza)":"")+'</span><span></span></div>'+
  '<div class="r"><span>Señal pagada</span><span style="color:var(--green);font-weight:800">'+money(senal)+'</span></div>'+
  '<div class="r big"><span>Pendiente (efectivo en bus)</span><span style="color:var(--amber)">'+money(pend)+'</span></div>'+aviso;
 window._pcalc={total:total,senal:senal,pend:pend,ad:c.ad,ni:c.ni,be:c.be,plazas:pl};
}
function autofill(){
 var tel=normTel(document.getElementById("p-tel").value),h=document.getElementById("p-hint");
 if(tel.length<6){h.textContent="";return}
 var found=null;
 Object.keys(DB.viajes).forEach(function(k){var v=DB.viajes[k];paxArr(v).forEach(function(p){if(normTel(p.tel)===tel&&p.nombre)found=p})});
 if(found){h.textContent="✓ Cliente conocido: "+found.nombre;
  if(!window._vj[0].nombre){window._vj[0].nombre=found.nombre;pintaV()}}
 else h.textContent="";
}
function guardarPax(vId,pId){
 calcPax();var c=window._pcalc;
 window._vj=window._vj.filter(function(x,i){return i===0||x.nombre.trim()||x.tipo!=="adulto"});
 if(!window._vj.length||!window._vj[0].nombre.trim()){toast("Pon al menos el nombre del titular");return}
 if(c.plazas<1){toast("La reserva no ocupa ninguna plaza");return}
 var v=DB.viajes[vId];var id=pId||uid("p");var prev=pId?v.pasajeros[pId]:{};
 var p={id:id,nombre:window._vj[0].nombre.trim(),viajeros:window._vj,
  tel:document.getElementById("p-tel").value.trim(),
  adultos:c.ad,ninos:c.ni,bebes:c.be,plazas:c.plazas,
  recogida:document.getElementById("p-rec").value.trim(),
  senal:c.senal,pendiente:c.pend,nota:document.getElementById("p-nota").value.trim(),
  embarcado:prev.embarcado||false,cobrado:prev.cobrado||false,ts:prev.ts||Date.now()};
 if(!v.pasajeros)v.pasajeros={};v.pasajeros[id]=p;wPax(vId,p);
 cerrar();render();toast(pId?"Reserva actualizada":"Reserva añadida");
}

/* ---------- Impresión ---------- */
function imprimir(vId){
 var v=DB.viajes[vId];if(!v)return;
 var lista=paxArr(v).sort(function(a,b){return (a.ts||0)-(b.ts||0)}).filter(function(p){return filtra(p)});
 var pl=0,se=0,pe=0;
 var filas=lista.map(function(p,i){
  var vjs=viajeros(p),c=cuenta(vjs),n=c.ad+c.ni;pl+=n;se+=(+p.senal||0);pe+=(+p.pendiente||0);
  var ac=vjs.slice(1).map(function(x){return esc(x.nombre||"(sin nombre)")+(x.tipo==="nino"?" (niño"+(x.edad?" "+x.edad:"")+")":x.tipo==="bebe"?" (bebé)":"")}).join(", ");
  return '<tr><td>'+(i+1)+'</td><td><b>'+esc(vjs[0].nombre)+'</b>'+(ac?'<div class="acp">'+ac+'</div>':"")+(n===1?'<div class="acp"><b>» NO SENTAR SOLO «</b></div>':"")+'</td>'+
   '<td>'+n+(c.be?"+"+c.be+"b":"")+'</td><td>'+esc(p.tel||"—")+'</td><td>'+esc(p.recogida||"")+'</td>'+
   '<td>'+money(+p.senal||0)+'</td><td><b>'+money(+p.pendiente||0)+'</b></td><td><span class="sq"></span></td><td></td></tr>'}).join("");
 var t=totViaje(v);
 document.getElementById("print-area").innerHTML=
  '<h1>'+esc(v.destino)+(FPT==="__all"?"":" — "+esc(FPT))+'</h1>'+
  '<div class="meta">'+(v.fecha?fmtF(v.fecha):"")+(v.hora?" · Salida "+esc(v.hora):"")+' · Reservas 614 599 790</div>'+
  '<div class="buses-p">'+(t.cap?esc(busNames(v))+" — capacidad "+t.cap+" plazas · ocupadas "+t.plazas+" · libres "+t.libres:"Sin autobús asignado")+'</div>'+
  '<table><thead><tr><th>Nº</th><th>Nombre(s)</th><th>Pax</th><th>Teléfono</th><th>Recogida</th><th>Señal</th><th>Pendiente</th><th>Sube</th><th>Cobrado en bus</th></tr></thead>'+
  '<tbody>'+filas+'</tbody>'+
  '<tfoot><tr><td colspan="2">TOTALES ('+lista.length+' reservas)</td><td>'+pl+'</td><td colspan="2"></td><td>'+money(se)+'</td><td>'+money(pe)+'</td><td colspan="2"></td></tr></tfoot></table>';
 window.print();
}

/* ---------- Overlay ---------- */
function abrirOv(){document.getElementById("ov").classList.add("on")}
function cerrar(){document.getElementById("ov").classList.remove("on")}
document.getElementById("ov").addEventListener("click",function(e){if(e.target.id==="ov")cerrar()});
</script></body></html>
