REF.on("value",function(s){var d=s.val()||{};DB={viajes:d.viajes||{},clientes:d.clientes||{},counters:d.counters||{}};
 document.getElementById("dot").classList.remove("off");render()},
 function(){document.getElementById("dot").classList.add("off")});

function wViaje(v){var c=Object.assign({},v);delete c.pasajeros;return REF.child("viajes/"+v.id).update(c).catch(fail)}
function wPax(vId,p){return REF.child("viajes/"+vId+"/pasajeros/"+p.id).update(p).catch(fail)}

function wUpd(p,v){return REF.child(p).update(v).catch(fail)}

function nextNum(c,d){return REF.child("counters/"+c).transaction(function(x){return (x==null||x<d)?d:x+1})
 .then(function(r){return r.snapshot.val()}).catch(function(){return d})}

/* ---------- Modelo ---------- */
function viajeros(p){
 if(p.viajeros&&p.viajeros.length)return p.viajeros;
 var a=[],n=(p.nombre||"").trim();if(n)a.push({nombre:n,tipo:"adulto",edad:"",rec:""});
 for(var i=1;i<(+p.adultos||0);i++)a.push({nombre:"",tipo:"adulto",edad:"",rec:""});
 for(var j=0;j<(+p.ninos||0);j++)a.push({nombre:"",tipo:"nino",edad:"",rec:""});
 return a}
function cuenta(v){var r={ad:0,ni:0,be:0};for(var i=0;i<v.length;i++){var t=v[i].tipo;if(t==="nino")r.ni++;else if(t==="bebe")r.be++;else r.ad++}return r}
function precioN(v){return (v.precioN!=null&&v.precioN!=="")?+v.precioN:(+v.precioA||0)}
function importe(v,vjs){var c=cuenta(vjs);return c.ad*(+v.precioA||0)+c.ni*precioN(v)}
function plazasDe(p){var c=cuenta(viajeros(p));return c.ad+c.ni}
function paxArr(v){var o=v.pasajeros||{};return Object.keys(o).map(function(k){return o[k]})}
function recBase(p,v){return (p.recogida||"").trim()||(v&&v.punto)||"(sin punto)"}
function recDe(p,x,v){return ((x&&x.rec)||"").trim()||recBase(p,v)}
function mixto(p,v){var b=recBase(p,v);return viajeros(p).some(function(x){return recDe(p,x,v)!==b})}
function capacidad(v){var t=0;BUSES.forEach(function(b){if(v.buses&&v.buses[b.id])t+=b.cap});return t}
function busSel(v){return BUSES.filter(function(b){return v.buses&&v.buses[b.id]})}
function busNames(v){return busSel(v).map(function(b){return b.n+" ("+b.cap+")"}).join(" + ")}
function totViaje(v){var p=paxArr(v),plazas=0,emb=0,senal=0,pend=0,cobBus=0,be=0;
 p.forEach(function(x){var pl=plazasDe(x);plazas+=pl;if(x.embarcado)emb+=pl;senal+=(+x.senal||0);pend+=(+x.pendiente||0);
  if(x.cobrado)cobBus+=(+x.pendiente||0);be+=cuenta(viajeros(x)).be});
 var cap=capacidad(v);
 return {plazas:plazas,emb:emb,senal:senal,pend:pend,cobBus:cobBus,cobrado:senal+cobBus,porcobrar:pend-cobBus,
  ngrupos:p.length,cap:cap,libres:cap-plazas,bebes:be}}
function puntosDe(v){var s={},a=[];paxArr(v).forEach(function(p){viajeros(p).forEach(function(x){var r=recDe(p,x,v);if(!s[r]){s[r]=1;a.push(r)}})});
 return a.sort(function(x,y){var i=PTS.indexOf(x),j=PTS.indexOf(y);return (i<0?9:i)-(j<0?9:j)||x.localeCompare(y)})}
function plazasPunto(v,pt){var n=0;paxArr(v).forEach(function(p){viajeros(p).forEach(function(x){
 if(x.tipo!=="bebe"&&recDe(p,x,v)===pt)n++})});return n}
function enPunto(p,pt,v){return viajeros(p).filter(function(x){return recDe(p,x,v)===pt})}

function renderLista(){

 var h='<h2>Viajes</h2><button class="btn bg2" style="margin-bottom:11px" onclick="modalImport()">\ud83d\udce5 Importar listado (Excel · PDF)</button>';

   '<div class="mini"><div><b>'+t.emb+'/'+t.plazas+'</b><small>Embarcados</small></div><div><b>'+money(t.cobrado)+'</b><small>Cobrado</small></div><div><b>'+money(t.porcobrar)+'</b><small>Por cobrar</small></div></div>'+cap+'</div>'}).join("")
  :'<div class="empty">Aún no hay viajes.<br>Pulsa <b>+ Nuevo viaje</b>.</div>';
 document.getElementById("app").innerHTML=h}

function filtra(p,v){
 if(FPT!=="__all"&&!enPunto(p,FPT,v).length)return false;
 if(!Q)return true;var q=Q.toLowerCase(),d=q.replace(/\D/g,"");
 if((p.nombre||"").toLowerCase().indexOf(q)>=0)return true;
 if((p.localizador||"").toLowerCase().indexOf(q)>=0)return true;
 if(d&&(p.tel||"").replace(/\D/g,"").indexOf(d)>=0)return true;
 return viajeros(p).some(function(x){return (x.nombre||"").toLowerCase().indexOf(q)>=0})}

 h+=ventasHTML(v);

 h+='<div class="chips"><div class="chip '+(FPT==="__all"?"on":"")+'" onclick="FPT=\'__all\';renderDetalle()">Todos ('+t.plazas+')</div>';
 pts.forEach(function(r){h+='<div class="chip '+(FPT===r?"on":"")+'" onclick="FPT=\''+jsq(r)+'\';renderDetalle()">'+esc(r)+' ('+plazasPunto(v,r)+')</div>'});
 h+='</div><button class="btn bg2" style="margin-bottom:8px" onclick="modalImport(\''+v.id+'\')">\ud83d\udce5 Importar reservas a este viaje (Excel · PDF)</button><button class="btn bg2" style="margin-bottom:11px" onclick="imprimir(\''+v.id+'\')">🖨️ Imprimir listado '+(FPT==="__all"?"completo":"de "+esc(FPT))+'</button>';
 h+=lista.length?lista.map(function(p){return paxRow(v,p)}).join(""):'<div class="empty">Ninguna reserva coincide.</div>';
 document.getElementById("app").innerHTML=h}

function paxRow(v,p){
 var vId=v.id,vjs=viajeros(p),c=cuenta(vjs),pl=c.ad+c.ni,tel=normTel(p.tel),mx=mixto(p,v);
 var acom=vjs.slice(1).map(function(x){
  var tg=x.tipo==="nino"?'<span class="tag n">niño'+(x.edad?" "+x.edad+"a":"")+'</span>':x.tipo==="bebe"?'<span class="tag b">bebé'+(x.edad?" "+x.edad:"")+'</span>':"";
  return tg+esc(x.nombre||"(sin nombre)")+(mx?' <span class="tag pt">'+esc(recDe(p,x,v))+'</span>':"")}).join(" · ");
 return '<div class="pax '+(p.embarcado?"emb":"")+' '+(p.cobrado?"cob":"")+'">'+
  '<div class="chk" onclick="toggleEmb(\''+vId+'\',\''+p.id+'\')">'+(p.embarcado?"✓":"")+'</div><div class="i">'+
  '<div class="n"><span class="titu">TITULAR</span>'+esc(vjs[0]?vjs[0].nombre:p.nombre)+(mx?' <span class="tag pt">'+esc(recDe(p,vjs[0],v))+'</span>':"")+'</div>'+
  (acom?'<div class="acom">'+acom+'</div>':"")+
  '<div class="mm">'+pl+' plaza(s)'+(c.be?" + "+c.be+" bebé":"")+(mx?' <span class="tag mix">RECOGIDAS DISTINTAS</span>':" · "+esc(recBase(p,v)))+(pl===1?' <span class="tag solo">no sentar solo</span>':"")+(p.nota?" · "+esc(p.nota):"")+'</div>'+
  '<div class="mm">🧑‍💼 <b>'+esc(p.vendedor||"SIN VENDEDOR")+'</b></div>'+
  (p.localizador?'<div class="loc">'+esc(p.localizador)+'</div>':"")+
  '<div class="acts">'+
   (tel?'<button class="tel" onclick="menuTel(\''+tel+'\',\''+jsq(vjs[0]?vjs[0].nombre:p.nombre)+'\')">📞 '+esc(p.tel)+'</button>':"")+
   '<button class="just" onclick="justificante(\''+vId+'\',\''+p.id+'\')">🧾 Justificante</button>'+
   '<button class="bc" onclick="toggleCob(\''+vId+'\',\''+p.id+'\')">'+(p.cobrado?"✓ Cobrado":"Cobrar "+(+p.pendiente||0)+"€")+'</button>'+
   '<button onclick="modalPax(\''+vId+'\',\''+p.id+'\')">✏️</button>'+
   '<button onclick="delPax(\''+vId+'\',\''+p.id+'\')">🗑️</button></div></div>'+
  '<div class="r"><div class="eur">'+money(+p.pendiente||0)+'</div><div class="cob-lbl">COBRADO</div></div></div>'}

function ventasVend(v){var g={};paxArr(v).forEach(function(p){var k=(p.vendedor||"").trim()||"SIN VENDEDOR";
 if(!g[k])g[k]={pl:0,se:0,pe:0,n:0};g[k].pl+=plazasDe(p);g[k].se+=(+p.senal||0);g[k].pe+=(+p.pendiente||0);g[k].n++});return g}
function ventasHTML(v){var g=ventasVend(v),ks=Object.keys(g).sort(function(a,b){return g[b].pl-g[a].pl});
 if(!ks.length)return "";
 return '<div class="card" style="padding:12px"><div style="font-size:13px;font-weight:800;margin-bottom:7px">🧑‍💼 Plazas por vendedor</div>'+
  ks.map(function(k){return '<div style="display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:4px 0;border-bottom:1px dashed var(--line)"><span>'+esc(k)+' <small style="color:var(--muted)">('+g[k].n+' reservas)</small></span><b>'+g[k].pl+' plazas · '+money(g[k].se)+'</b></div>'}).join("")+'</div>'}

function totPlazas(c){var v=c.viajes||{};return Object.keys(v).reduce(function(s,k){return s+(+v[k].plazas||0)},0)}

  if(!QC)return true;var q=QC.toLowerCase();
  return (c.nombre||"").toLowerCase().indexOf(q)>=0||(""+(c.tel||"")).indexOf(q.replace(/\D/g,""))>=0})
  .sort(function(a,b){return nViajes(b)-nViajes(a)||(a.nombre||"").localeCompare(b.nombre||"")});

 var h='<h2>Clientes ('+tot+')</h2>';
 h+='<div class="search"><input id="qc" placeholder="🔍 Buscar cliente por nombre o teléfono" value="'+esc(QC)+'" oninput="QC=this.value;renderClientes();var e=document.getElementById(\'qc\');e.focus();e.setSelectionRange(e.value.length,e.value.length)"></div>';
 h+=cs.length?cs.map(function(c){var n=nViajes(c);
  return '<div class="cli" onclick="abrirCliente(\''+c.tel+'\')"><div class="av">'+esc((c.nombre||"?").trim().charAt(0).toUpperCase())+'</div>'+

  :'<div class="empty">'+(tot?"Ningún cliente coincide.":"Aún no hay clientes.<br>Se crean solos al guardar reservas con teléfono.")+'</div>';
 document.getElementById("app").innerHTML=h}
function abrirCliente(tel){

 var vs=Object.keys(c.viajes||{}).map(function(k){return c.viajes[k]}).sort(function(a,b){return (""+(b.fecha||"")).localeCompare(a.fecha||"")});
 var wa="https://wa.me/34"+c.tel+"?text="+encodeURIComponent("Hola "+c.nombre+", te escribo de "+MARCA+".");

/* ---------- Autobuses ---------- */

function togBus(id){window._bus[id]=!window._bus[id];var e=document.getElementById("bo_"+id);
 e.classList.toggle("on",!!window._bus[id]);e.querySelector(".bx").textContent=window._bus[id]?"✓":"";capInfo()}
function capInfo(){var t=0;BUSES.forEach(function(b){if(window._bus[b.id])t+=b.cap});
 var el=document.getElementById("capinfo");if(!el)return;
 var v=CUR?DB.viajes[CUR]:null,oc=(v&&window._conOcup)?totViaje(v).plazas:0;
 el.innerHTML=t?("Capacidad total: <b>"+t+" plazas</b>"+(window._conOcup?" · ocupadas "+oc+" · "+((t-oc)>=0?"<b style='color:var(--green)'>"+(t-oc)+" libres</b>":"<b style='color:var(--red)'>SOBREVENTA "+(oc-t)+"</b>"):"")):"Sin autobús seleccionado"}
function modalBuses(vId){
 var v=DB.viajes[vId];window._bus=Object.assign({},v.buses||{});window._conOcup=true;
 sheet('<h2>🚌 Autobuses del viaje</h2><div style="font-size:12.5px;color:var(--muted)">'+esc(v.destino)+(v.fecha?" · "+fmtF(v.fecha):"")+'</div>',
  '<div class="buses">'+busOps(window._bus)+'</div><div id="capinfo" style="font-size:13.5px;font-weight:800;margin-top:11px;color:var(--navy)"></div>'+
  '<div class="note">Las cuadrículas de recuento del listado impreso se generan según los buses que marques aquí.</div>',
  '<button class="btn bg2" onclick="cerrar()">Cancelar</button><button class="btn bp" onclick="guardarBuses(\''+vId+'\')">Guardar</button>');
 capInfo()}
function guardarBuses(vId){DB.viajes[vId].buses=Object.assign({},window._bus);
 wField("viajes/"+vId+"/buses",window._bus);cerrar();render();toast("Autobuses actualizados")}

/* ---------- Selector de punto (pestañas) ---------- */

/* ---------- Importar: utilidades ---------- */
var IMP=[],IMPinfo="",IMPmeta={},IMPdest="",IMPupd=false;
var MESES=["ENERO","FEBRERO","MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"];
function norm(x){return (""+(x==null?"":x)).toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim()}
function numero(x){if(x==null||x==="")return 0;var s=(""+x).replace(/[^0-9,.\-]/g,"").replace(",",".");var n=parseFloat(s);return isNaN(n)?0:n}
function puntoDe(txt){var t=norm(txt);if(!t)return "";
 var c=[["Plaza Elíptica",Math.max(t.lastIndexOf("ELIPT"),t.lastIndexOf("ELIPIT"))],["Atocha",t.lastIndexOf("ATOCHA")],
  ["Puente de Vallecas",Math.max(t.lastIndexOf("VALLECAS"),/^PUENTE\b|\bPUENTE$/.test(t)?t.lastIndexOf("PUENTE"):-1)]];
 c.sort(function(a,b){return b[1]-a[1]});return c[0][1]>=0?c[0][0]:""}
function titulo(s){return (""+s).toLowerCase().replace(/(^|[\s\-(])([a-zà-ÿñ])/g,function(m,a,b){return a+b.toUpperCase()}).replace(/\b(De|La|Las|Del|Los|El|Y)\b/g,function(m,x,i){return i?m.toLowerCase():m})}
function claveNom(n){return norm(n).replace(/[^A-Z ]/g,"").split(" ").filter(Boolean).slice(0,2).join(" ")}

/* una persona a partir de un trozo de texto: "Luis (niño 6) [Atocha]" */
function persona(tok){
 var t=(""+tok).trim(),tipo="adulto",edad="",rec="";
 var b=t.match(/\[([^\]]*)\]/);if(b){rec=puntoDe(b[1]);t=t.replace(b[0],"")}
 var n=t.match(/\(\s*ni[ñn][oa]s?\s*(\d+)?[^)]*\)/i);if(n){tipo="nino";edad=n[1]||"";t=t.replace(n[0],"")}
 var e=t.match(/\(\s*beb[eé][^)]*\)/i);if(e){tipo="bebe";t=t.replace(e[0],"")}
 if(/^\s*ni[ñn][oa]\s*$/i.test(t))t="";
 t=t.replace(/\(.*?\)/g,"").replace(/\s+/g," ").replace(/^[,\s·-]+|[,\s·-]+$/g,"");
 return {nombre:t,tipo:tipo,edad:edad,rec:rec}}
function limpiaSinNombre(s){return (""+s).replace(/\+?\s*\d+\s+acompa[ñn]antes?\s+sin\s+nombre/gi,"").replace(/\(sin nombre\)/gi,"").replace(/\s+/g," ").trim()}
function partes(s){return limpiaSinNombre(s).split(/\s*,\s*|\s+[Yy]\s+|\s*\/\s*/).map(function(x){return x.trim()}).filter(function(x){return x&&!/^[,.\-·]+$/.test(x)})}
/* monta la lista de viajeros respetando las plazas */
function montaViajeros(tit,resto,pax,bebes){
 var vj=[];
 if(tit!=null){var p0=persona(tit);vj.push(p0)}
 (resto||[]).forEach(function(t){var p=persona(t);if(p.nombre||p.tipo!=="adulto")vj.push(p)});
 if(!vj.length)vj.push({nombre:"",tipo:"adulto",edad:"",rec:""});
 function ocupa(){return vj.filter(function(x){return x.tipo!=="bebe"}).length}
 /* si hay más huecos que plazas: quita los "sin nombre" sobrantes; un niño sin nombre pasa su tipo al último nombrado */
 while(ocupa()>pax){
  var ia=-1,ino=-1;for(var q=vj.length-1;q>0;q--){if(!vj[q].nombre&&vj[q].tipo==="adulto"&&ia<0)ia=q;if(!vj[q].nombre&&vj[q].tipo==="nino"&&ino<0)ino=q}
  if(ia>0){vj.splice(ia,1);continue}
  if(ino>0){var ed=vj[ino].edad;vj.splice(ino,1);
   for(var z=vj.length-1;z>=0;z--)if(vj[z].tipo==="adulto"&&vj[z].nombre){vj[z].tipo="nino";vj[z].edad=vj[z].edad||ed;break}
   continue}
  break}
 for(var k=ocupa();k<pax;k++)vj.push({nombre:"",tipo:"adulto",edad:"",rec:""});
 var be=vj.filter(function(x){return x.tipo==="bebe"}).length;
 for(var j=be;j<(bebes||0);j++)vj.push({nombre:"",tipo:"bebe",edad:"",rec:""});
 return vj}
function troceaNombres(nom,pax){var ps=partes(nom);return montaViajeros(ps[0]||nom,ps.slice(1),pax,0)}

/* destino y fecha a partir de los primeros textos del archivo */
function detectaMeta(textos){
 var m={destino:"",fecha:""};
 textos.slice(0,12).forEach(function(L){var t=norm(L);if(!t)return;
  if(!m.fecha){var d=t.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
   if(d)m.fecha=d[3]+"-"+("0"+d[2]).slice(-2)+"-"+("0"+d[1]).slice(-2);
   else{var e=t.match(new RegExp("(\\d{1,2})\\s+(?:DE\\s+)?("+MESES.join("|")+")(?:\\s+(?:DE\\s+)?(\\d{4}))?"));
    if(e)m.fecha=(e[3]||new Date().getFullYear())+"-"+("0"+(MESES.indexOf(e[2])+1)).slice(-2)+"-"+("0"+e[1]).slice(-2)}}
  if(!m.destino){var v=t.match(/VIAJE\s+A\s+(.+?)\s+EL\b/);
   if(v)m.destino=v[1];
   else if(/^[A-Z]/.test(t)&&!/^(LISTADO|SALIDA|VIAJA CON|CONDUCTOR|RECOGIDA|N|NOMBRE)/.test(t)){
    var c=t.split("·")[0].replace(/\b(LUNES|MARTES|MIERCOLES|JUEVES|VIERNES|SABADO|DOMINGO)\b.*$/,"").replace(/\s\d.*$/,"").trim();
    if(c.length>=3&&c.length<40)m.destino=c}}});
 if(m.destino)m.destino=titulo(m.destino);
 return m}

/* ---------- Excel / CSV ---------- */
function mapCols(fila){
 var m={};fila.forEach(function(c,i){var t=norm(c);
  if(m.nombre==null&&t.indexOf("NOMBRE")>=0)m.nombre=i;
  else if(m.pax==null&&(t.indexOf("CANT")>=0||t.indexOf("PERSONA")>=0||t==="PAX"||t==="PLAZAS"))m.pax=i;
  else if(m.se==null&&(t.indexOf("RESERVA")>=0||t.indexOf("SENAL")>=0||t.indexOf("PAGA")>=0||t.indexOf("PAGO")>=0))m.se=i;
  else if(m.pe==null&&(t.indexOf("PENDIENTE")>=0||t.indexOf("PDTE")>=0||t.indexOf("DEBE")>=0))m.pe=i;
  else if(m.tel==null&&(t.indexOf("TELEF")>=0||t.indexOf("MOVIL")>=0||t.indexOf("WHATS")>=0))m.tel=i;
  else if(m.rec==null&&(t.indexOf("RECOGIDA")>=0||t.indexOf("PUNTO")>=0||t.indexOf("PARADA")>=0))m.rec=i});
 return m}
function esBasura(n){var t=norm(n);
 return !t||/^(LISTADO|SALIDA|TOTAL|NOMBRES?|NOMBRE\(S\))\b/.test(t)}
function leerExcel(ab){
 var wb=XLSX.read(new Uint8Array(ab),{type:"array"}),out=[],textos=[];
 wb.SheetNames.forEach(function(sn){
  var f=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,blankrows:false,defval:""});
  var pHoja=puntoDe(sn),m=null;
  f.forEach(function(r){
   if(!r||!r.length)return;
   if(!m){ textos.push(r.join(" "));
     if(r.some(function(c){return norm(c).indexOf("NOMBRE")>=0})){m=mapCols(r)}
     else{var p=puntoDe(r.join(" "));if(p)pHoja=p}
     return}
   var nom=r[m.nombre];
   if(esBasura(nom))return;
   var pax=m.pax!=null?Math.round(numero(r[m.pax])):0;
   var ps=partes(nom);
   if(!pax)pax=Math.max(1,ps.length);
   var tel=m.tel!=null?(""+(r[m.tel]||"")).replace(/\D/g,"").slice(-9):"";
   out.push({vj:montaViajeros(ps[0]||(""+nom).trim(),ps.slice(1),pax,0),pax:pax,
    se:m.se!=null?numero(r[m.se]):0, pe:m.pe!=null?numero(r[m.pe]):0, tel:tel,
    rec:(m.rec!=null?puntoDe(r[m.rec]):"")||pHoja})});
 });
 IMPmeta=detectaMeta(textos);
 return out}

/* ---------- PDF (lectura por columnas) ---------- */
function leerPDF(ab){
 if(typeof pdfjsLib==="undefined")return Promise.reject(new Error("el lector de PDF no se ha cargado (revisa la conexión)"));
 try{pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"}catch(e){}
 return pdfjsLib.getDocument({data:new Uint8Array(ab)}).promise.then(function(doc){
  var t=[];for(var i=1;i<=doc.numPages;i++)t.push(doc.getPage(i).then(function(pg){return pg.getTextContent()}));
  return Promise.all(t)}).then(function(pags){
  var out=[],textos=[],raros=0,total=0,st={H:null,pDef:"",cur:null,primera:true};
  pags.forEach(function(tc){
   tc.items.forEach(function(it){var s=it.str||"";total+=s.length;raros+=(s.match(/[\u0000-\u001f]/g)||[]).length});
   leePagina(tc,out,textos,st);st.primera=false});
  if(st.cur){var rf=construye(st.cur,st.pDef);if(rf)out.push(rf);st.cur=null}
  if(total&&raros/total>0.25)throw new Error("este PDF no tiene texto legible (se exportó como imagen). Vuelve a exportarlo desde la app o pásalo a Excel.");
  IMPmeta=detectaMeta(textos);
  return out})}
function leePagina(tc,out,textos,st){
 var its=tc.items.filter(function(it){return it.str&&it.str.trim()}).map(function(it){
  return {x:it.transform[4],y:it.transform[5],w:it.width||0,s:it.str.trim(),f:it.fontName||""}});
 its.sort(function(a,b){return b.y-a.y||a.x-b.x});
 var L=[];its.forEach(function(it){var l=L[L.length-1];
  if(l&&Math.abs(l.y-it.y)<=2.5)l.it.push(it);else L.push({y:it.y,it:[it]})});
 L.forEach(function(l){l.it.sort(function(a,b){return a.x-b.x});l.t=l.it.map(function(o){return o.s}).join(" ").replace(/\s+/g," ")});
 /* fuera las líneas que añade el navegador al imprimir */
 L=L.filter(function(l){return !/HTTPS?:|PAGINA \d+ DE \d+|^GESTOR DE EMBARQUE|^\d{1,2}\/\d{1,2}\/\d{2},/.test(norm(l.t))});
 var hi=-1,H={},previos=[];
 for(var i=0;i<L.length;i++){
  var tt=norm(L[i].t);
  if(tt.indexOf("NOMBRE")>=0&&/\bPAX\b/.test(tt)){hi=i;break}
  previos.push(L[i].t)}
 if(st.primera)previos.forEach(function(x){textos.push(x)});
 previos.forEach(function(x){var n=norm(x);if(/RECOGIDA\s*:/.test(n)){var p=puntoDe(n.split("RECOGIDA")[1]);if(p){
  if(st.cur){var r0=construye(st.cur,st.pDef);if(r0)out.push(r0);st.cur=null}
  st.pDef=p}}});
 if(hi<0){ if(!st.H)return; H=st.H; hi=-1 }
 else L[hi].it.forEach(function(o){var t=norm(o.s),cx=o.x+o.w/2;
  if(/^N[º°O]?$|^NO$/.test(t)&&H.num==null)H.num=o.x;
  else if(t.indexOf("NOMBRE")>=0)H.nombre=o.x;
  else if(t==="PAX"||t==="PLAZAS")H.pax=cx;
  else if(t.indexOf("TELEF")>=0)H.tel=cx;
  else if(t.indexOf("RECOGIDA")>=0)H.rec=cx;
  else if(t.indexOf("SENAL")>=0)H.se=cx;
  else if(t.indexOf("PDTE")>=0||t.indexOf("PENDIENTE")>=0)H.pe=cx;
  else if(t==="SUBE")H.sube=cx;
  else if(t.indexOf("COBRAD")>=0)H.cob=cx});
 if(hi>=0){st.H=H;st.fin=false}
 else if(st.fin)return;
 var cols=["pax","tel","rec","se","pe","sube","cob"].filter(function(k){return H[k]!=null});
 if(H.pax==null)return;
 function col(o){
  if(H.num!=null&&Math.abs(o.x-H.num)<10&&/^\d{1,3}$/.test(o.s))return "num";
  if(o.x<H.pax-10)return "nom";
  var cx=o.x+o.w/2,best=null,bd=1e9;cols.forEach(function(k){var d=Math.abs(cx-H[k]);if(d<bd){bd=d;best=k}});return best}
 function cierra(){if(!st.cur)return;var r=construye(st.cur,st.pDef);if(r)out.push(r);st.cur=null}
 for(var j=hi+1;j<L.length;j++){
  var l=L[j],nt=norm(l.t);
  if(/^TOTAL|RECUENTO DE SUBIDA|^BUS (GRANDE|MEDIANO|PEQUENO)|^CAPACIDAD|^NOTAS?\b/.test(nt)){cierra();st.fin=true;break}
  var g={num:[],nom:[],pax:[],tel:[],rec:[],se:[],pe:[]};
  l.it.forEach(function(o){var c=col(o);if(g[c])g[c].push(o)});
  var paxN=g.pax.length&&/^\d{1,3}/.test(g.pax[0].s);
  var inicio=paxN&&(H.num==null||g.num.length);
  if(inicio){cierra();st.cur={nom:[],pax:[],tel:[],rec:[],se:[],pe:[]}}
  else if(g.num.length&&!g.pax.length){cierra();continue}
  if(!st.cur)continue;
  if(g.nom.length)st.cur.nom.push({t:g.nom.map(function(o){return o.s}).join(" "),f:g.nom[0].f});
  ["pax","tel","rec","se","pe"].forEach(function(k){g[k].forEach(function(o){st.cur[k].push(o.s)})})}
}
function construye(c,pDef){
 var lineas=c.nom.filter(function(x){var t=norm(x.t);
  return !/NO SENTAR SOLO|ALTA NUEVA|REVISAR IMPORTE|^\(!\)|^PAGA CON/.test(t)}).map(function(x){
  return {t:x.t.replace(/VCS-\d+/gi,"").replace(/·?\s*vend:.*$/i,"").replace(/^[\s·]+|[\s·]+$/g,""),f:x.f}}).filter(function(x){return x.t});
 var segs=[];lineas.forEach(function(x){var s=segs[segs.length-1];if(s&&s.f===x.f)s.t+=" "+x.t;else segs.push({t:x.t,f:x.f})});
 segs=segs.map(function(x){return {t:limpiaSinNombre(x.t).replace(/^[,\s]+|[,\s]+$/g,""),f:x.f,orig:x.t}}).filter(function(x){return x.t});
 var tit,resto;
 if(segs.length>1){tit=limpiaSinNombre(segs[0].t);resto=partes(segs.slice(1).map(function(s){return s.t}).join(", "))}
 else{var ps=partes(segs.length?segs[0].t:"");tit=ps[0]||"";resto=ps.slice(1)}
 if(!tit)return null;
 var pt=c.pax.join(" "),pax=parseInt(pt,10)||1,bm=pt.match(/\+\s*(\d+)\s*b/i);
 var vj=montaViajeros(tit,resto,pax,bm?parseInt(bm[1],10):0);
 var recTxt=c.rec.join(" "),rec=/VARIOS/i.test(recTxt)?"":puntoDe(recTxt);
 if(!rec){var cnt={};vj.forEach(function(x){if(x.rec)cnt[x.rec]=(cnt[x.rec]||0)+1});
  rec=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]})[0]||pDef}
 vj.forEach(function(x){if(x.rec===rec)x.rec=""});
 var tel=(c.tel.join("").match(/\d{9}/)||[""])[0];
 function dinero(a){for(var i=0;i<a.length;i++)if(/\d/.test(a[i]))return numero(a[i]);return 0}
 return {vj:vj,pax:pax,se:dinero(c.se),pe:dinero(c.pe),tel:tel,rec:rec}}

/* ---------- Importar: pantallas ---------- */
function modalImport(destId){
 IMP=[];IMPinfo="";IMPmeta={};IMPdest=destId||"";IMPupd=false;
 var v=destId&&DB.viajes[destId];
 sheet('<h2>📥 Importar listado</h2><div style="font-size:12.5px;color:var(--muted)">'+(v?"A: "+esc(v.destino)+(v.fecha?" · "+fmtF(v.fecha):""):"Excel, CSV, PDF o JSON")+'</div>',
  '<div class="drop" onclick="document.getElementById(\'fich\').click()"><b>Elegir archivo</b>Excel (.xlsx) · CSV · PDF · JSON</div>'+

  '<div id="impmsg" style="font-size:12.5px;margin-top:10px;color:var(--muted)"></div>'+

  '<button class="btn bg2" onclick="cerrar()">Cancelar</button>')}
function cargarFichero(inp){
 var f=inp.files&&inp.files[0];if(!f)return;
 var msg=document.getElementById("impmsg");msg.textContent="Leyendo "+f.name+"…";
 var ext=(f.name.split(".").pop()||"").toLowerCase();
 var fr=new FileReader();
 fr.onload=function(){
  try{
   if(ext==="json"){
    var o=JSON.parse(fr.result);var vs=o.viajes||o,n=0,np=0;
    Object.keys(vs).forEach(function(k){var v=vs[k];if(!v||!v.destino)return;
     v.id=v.id||k;DB.viajes[v.id]=v;np+=Object.keys(v.pasajeros||{}).length;n++;
     REF.child("viajes/"+v.id).set(v).catch(fail)});
    cerrar();render();toast(n+" viaje(s) y "+np+" reservas importadas");return}
   if(ext==="pdf"){
    leerPDF(fr.result).then(function(r){IMP=r;IMPinfo=f.name;previsualiza()})
     .catch(function(e){msg.textContent="No se pudo leer el PDF: "+e.message});return}
   if(ext==="csv"){
    var wb=XLSX.read(fr.result,{type:"string"});
    IMP=leerExcel(XLSX.write(wb,{type:"array",bookType:"xlsx"}))}
   else IMP=leerExcel(fr.result);
   IMPinfo=f.name;previsualiza();
  }catch(e){msg.textContent="Error leyendo el archivo: "+e.message}};
 fr.onerror=function(){msg.textContent="No se pudo abrir el archivo"};
 if(ext==="json"||ext==="csv")fr.readAsText(f);else fr.readAsArrayBuffer(f)}

/* viaje existente que encaja con el archivo (misma fecha y/o destino) */
function buscaViaje(meta){
 var stop={"DE":1,"LA":1,"LAS":1,"EL":1,"LOS":1,"DEL":1,"VIAJE":1,"EXCURSION":1};
 var pal=norm(meta.destino||"").replace(/[^A-Z ]/g," ").split(" ").filter(function(w){return w.length>=4&&!stop[w]}).map(function(w){return w.replace(/S$/,"")});
 var mejor="",pts=0;
 Object.keys(DB.viajes).forEach(function(k){var v=DB.viajes[k],s=0,d=norm(v.destino);
  if(meta.fecha&&v.fecha===meta.fecha)s+=2;
  if(pal.some(function(w){return d.indexOf(w)>=0}))s+=1;
  if(s>pts){pts=s;mejor=k}});
 return pts>=2?mejor:""}
function marcaDup(){
 var sel=(document.getElementById("imp-dest")||{}).value||"",v=DB.viajes[sel];
 var ex={};if(v)paxArr(v).forEach(function(p){var t=viajeros(p)[0];ex["N"+claveNom(t?t.nombre:p.nombre)]=p.id;var tl=normTel(p.tel);if(tl.length===9)ex["T"+tl]=p.id});
 IMP.forEach(function(r){r.dup="";if(!v)return;
  var k="N"+claveNom(r.vj[0].nombre);if(ex[k])r.dup=ex[k];else if(r.tel&&ex["T"+r.tel])r.dup=ex["T"+r.tel]})}
function previsualiza(){
 if(!IMP.length){document.getElementById("impmsg").textContent="No se ha reconocido ninguna reserva en el archivo.";return}
 var dest=IMPdest||buscaViaje(IMPmeta),auto=!IMPdest&&!!dest;
 var opts=Object.keys(DB.viajes).map(function(k){return DB.viajes[k]}).sort(function(a,b){return (""+(b.fecha||"")).localeCompare(a.fecha||"")}).map(function(v){
  return '<option value="'+v.id+'"'+(v.id===dest?" selected":"")+'>'+(v.num?"Nº "+v.num+" · ":"")+esc(v.destino)+(v.fecha?" · "+fmtF(v.fecha):"")+'</option>'}).join("");
 sheet('<h2>Revisar importación</h2><div style="font-size:12.5px;color:var(--muted)">'+esc(IMPinfo)+'</div>',
  '<div class="sumbox" id="imp-sum"></div>'+
  '<label>Viaje donde se integran</label>'+
  (auto?'<div class="hint" style="margin:-2px 0 6px">✓ Detectado automáticamente por destino y fecha</div>':"")+
  '<select id="imp-dest" onchange="cambiaDest()"><option value="__new"'+(dest?"":" selected")+'>➕ Crear un viaje nuevo</option>'+opts+'</select>'+
  '<div id="imp-nuevo" style="display:'+(dest?"none":"")+'">'+
   '<div class="row2"><div><label>Destino</label><input id="i-dest" value="'+esc(IMPmeta.destino||"")+'" placeholder="Lagunas de Ruidera"></div>'+
   '<div><label>Fecha</label><input id="i-fecha" type="date" value="'+(IMPmeta.fecha||"")+'"></div></div>'+
   '<div class="row2"><div><label>Hora salida</label><input id="i-hora" placeholder="07:15"></div>'+
   '<div><label>Regreso</label><input id="i-reg" placeholder="18:00"></div></div>'+

 L.push("Señal pagada: -"+money(+p.senal||0));
 L.push("*PENDIENTE en metálico el día del viaje: "+money(+p.pendiente||0)+"*");
 L.push("");
 L.push("⚠️ *"+AVISO1+"*");
 L.push(AVISO2);
 L.push("");
 L.push("_Presenta este justificante al subir al autobús. El autobús no espera: sé puntual. La señal no es reembolsable, pero es transferible avisando con 48 h._");
 L.push("");
 L.push(MARCA+"  ·  "+TEL_EMP);
 return L.join("\n")}
function justificante(vId,pId,auto){

   '<button class="btn bg2" onclick="cerrar()">'+(auto?"Listo":"Cerrar")+'</button>')};
 if(p.localizador)run();
 else nextNum("loc",1).then(function(n){p.localizador="VCS-"+pad(n,4);wField("viajes/"+vId+"/pasajeros/"+pId+"/localizador",p.localizador);run()})}
function copiarJust(vId,pId){var v=DB.viajes[vId],p=v.pasajeros[pId];
 if(navigator.clipboard)navigator.clipboard.writeText(textoJust(v,p));toast("Justificante copiado")}

  '<div class="ft">RESERVAS E INFORMACIÓN · '+TEL_EMP+' · @viaja_con_sergio</div></div>';
 window.print()}

/* ---------- Listado impreso ---------- */
function imprimir(vId){
 var v=DB.viajes[vId];if(!v)return;
 var uno=FPT!=="__all";
 var lista=paxArr(v).sort(function(a,b){return (a.ts||0)-(b.ts||0)}).filter(function(p){return filtra(p,v)});
 var pl=0,se=0,pe=0,i=0,filas="";
 lista.forEach(function(p){
  var vjs=viajeros(p),mx=mixto(p,v);
  var mios=uno?enPunto(p,FPT,v):vjs;
  if(!mios.length)return;
  var cm=cuenta(mios),n=cm.ad+cm.ni;pl+=n;
  var titAqui=mios.indexOf(vjs[0])>=0;
  var cobra=(!uno||titAqui);
  if(cobra){se+=(+p.senal||0);pe+=(+p.pendiente||0)}
  i++;
  var tit=titAqui?vjs[0]:mios[0];
  var resto=mios.filter(function(x){return x!==tit});
  var ac=resto.map(function(x){return esc(x.nombre||"(sin nombre)")+
   (x.tipo==="nino"?" (niño"+(x.edad?" "+x.edad:"")+")":x.tipo==="bebe"?" (bebé)":"")+
   ((mx&&!uno)?" ["+esc(recDe(p,x,v))+"]":"")}).join(", ");
  filas+='<tr><td class="ce">'+i+'</td><td><div class="nm">'+esc(tit.nombre||"(sin nombre)")+
   ((mx&&!uno)?' ['+esc(recDe(p,tit,v))+']':"")+'</div>'+
   (ac?'<div class="ac">'+ac+'</div>':"")+
   (n===1?'<div class="so">» NO SENTAR SOLO «</div>':"")+
   (!titAqui?'<div class="so">Paga con '+esc(vjs[0].nombre)+' en '+esc(recDe(p,vjs[0],v))+'</div>':"")+
   '<div class="lc">'+esc(p.localizador||"")+(p.vendedor?" · vend: "+esc(p.vendedor):"")+'</div></td>'+
   '<td class="ce"><b>'+n+'</b>'+(cm.be?"<br>+"+cm.be+"b":"")+'</td>'+
   '<td>'+esc(p.tel||"—")+'</td>'+
   (uno?"":'<td>'+esc(mx?"varios":recBase(p,v))+'</td>')+
   '<td class="ce">'+(cobra?money(+p.senal||0):"—")+'</td>'+
   '<td class="pe">'+(cobra?money(+p.pendiente||0):"—")+'</td>'+
   '<td class="ce"><span class="sq"></span></td><td></td></tr>'});
 var vac=uno?Math.max(0,14-i):Math.max(0,6-i);
 for(var k=0;k<vac;k++){i++;filas+='<tr><td class="ce" style="color:#aaa">'+i+'</td><td></td><td></td><td></td>'+(uno?"":"<td></td>")+'<td></td><td></td><td class="ce"><span class="sq"></span></td><td></td></tr>'}
 var t=totViaje(v);
 var grids=busSel(v).map(function(b){
  var c='<div class="gr-h"><span>RECUENTO DE SUBIDA — '+b.n.toUpperCase()+' ('+b.cap+' plazas)</span><span>Tachar un número por cada pasajero que sube</span></div><table class="gr">';
  for(var x=1;x<=b.cap;){c+="<tr>";for(var y=0;y<33;y++){c+=x<=b.cap?"<td>"+x+"</td>":'<td style="background:#e6e9ef"></td>';x++}c+="</tr>"}
  return c+'</table><div class="fir"><span>TOTAL SUBIDOS: __________</span><span>Firma: ______________________</span><span>Hora real: __________</span></div>'}).join("");
 document.getElementById("print-area").innerHTML=
  '<div class="lst-h"><h1>'+esc((v.destino||"").toUpperCase())+' · '+esc(fmtLargo(v.fecha))+'</h1>'+
  '<div class="s1">'+MARCA+' · Organización '+TEL_EMP+(v.regreso?' · Regreso desde '+esc(v.destino)+' '+esc(v.regreso):"")+(v.num?' · Viaje Nº '+v.num:"")+'</div>'+
  '<div class="s2">'+(uno?"RECOGIDA: "+esc(FPT).toUpperCase():"LISTADO COMPLETO")+(v.hora?' · SALIDA '+esc(v.hora):"")+' · '+pl+' PASAJEROS</div></div>'+
  '<div class="lst-i"><span>Conductor: __________ Matrícula: _________ Hora real: ______ · Presentación 15 min antes</span><span class="rr">» NO SENTAR SOLO « = sentar junto a otro pasajero</span></div>'+
  '<table class="lst"><thead><tr><th style="width:4%">Nº</th><th>NOMBRE(S)</th><th style="width:6%">PAX</th><th style="width:14%">TELÉFONO</th>'+
  (uno?"":'<th style="width:13%">RECOGIDA</th>')+
  '<th style="width:9%">SEÑAL</th><th style="width:10%">PDTE. €</th><th style="width:6%">SUBE</th><th style="width:11%">COBRADO</th></tr></thead>'+
  '<tbody>'+filas+'</tbody>'+
  '<tfoot><tr><td colspan="2">TOTALES</td><td class="ce">'+pl+'</td><td'+(uno?'':' colspan="2"')+'></td><td class="ce">'+money(se)+'</td><td class="pe">'+money(pe)+'</td><td colspan="2"></td></tr></tfoot></table>'+
  (t.cap?'<div style="font-size:9.5px;margin-top:5px">'+esc(busNames(v))+' — capacidad '+t.cap+' · ocupadas '+t.plazas+' · libres '+t.libres+'</div>':"")+grids;
 window.print()}
