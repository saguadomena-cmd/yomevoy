 for(var i=1;i<(+p.adultos||0);i++)a.push({nombre:"",tipo:"adulto",edad:"",rec:""});
 for(var j=0;j<(+p.ninos||0);j++)a.push({nombre:"",tipo:"nino",edad:"",rec:""});
 return a}
function cuenta(v){var r={ad:0,ni:0,be:0};for(var i=0;i<v.length;i++){var t=v[i].tipo;if(t==="nino")r.ni++;else if(t==="bebe")r.be++;else r.ad++}return r}
function precioN(v){return (v.precioN!=null&&v.precioN!=="")?+v.precioN:(+v.precioA||0)}
function importe(v,vjs){var c=cuenta(vjs);return c.ad*(+v.precioA||0)+c.ni*precioN(v)}
function plazasDe(p){var c=cuenta(viajeros(p));return c.ad+c.ni}
function paxArr(v){var o=v.pasajeros||{};return Object.keys(o).map(function(k){return o[k]})}
function recBase(p,v){return (p.recogida||"").trim()||(v&&v.punto)||"(sin punto)"}
function recDe(p,x,v){return ((x&&x.rec)||"").trim()||recBase(p,v)}
function mixto(p,v){var b=recBase(p,v);return viajeros(p).some(function(x){return recDe(p,x,v)!==b})}
function capacidad(v){var t=0;BUSES.forEach(function(b){if(v.buses&&v.buses[b.id])t+=b.cap});return t}
function busSel(v){return BUSES.filter(function(b){return v.buses&&v.buses[b.id]})}
function busNames(v){return busSel(v).map(function(b){return b.n+" ("+b.cap+")"}).join(" + ")}
function totViaje(v){var p=paxArr(v),plazas=0,emb=0,senal=0,pend=0,cobBus=0,be=0;
 p.forEach(function(x){var pl=plazasDe(x);plazas+=pl;if(x.embarcado)emb+=pl;senal+=(+x.senal||0);pend+=(+x.pendiente||0);
  if(x.cobrado)cobBus+=(+x.pendiente||0);be+=cuenta(viajeros(x)).be});
 var cap=capacidad(v);
 return {plazas:plazas,emb:emb,senal:senal,pend:pend,cobBus:cobBus,cobrado:senal+cobBus,porcobrar:pend-cobBus,
  ngrupos:p.length,cap:cap,libres:cap-plazas,bebes:be}}
function puntosDe(v){var s={},a=[];paxArr(v).forEach(function(p){viajeros(p).forEach(function(x){var r=recDe(p,x,v);if(!s[r]){s[r]=1;a.push(r)}})});
 return a.sort(function(x,y){var i=PTS.indexOf(x),j=PTS.indexOf(y);return (i<0?9:i)-(j<0?9:j)||x.localeCompare(y)})}
function plazasPunto(v,pt){var n=0;paxArr(v).forEach(function(p){viajeros(p).forEach(function(x){
 if(x.tipo!=="bebe"&&recDe(p,x,v)===pt)n++})});return n}
function enPunto(p,pt,v){return viajeros(p).filter(function(x){return recDe(p,x,v)===pt})}

function filtra(p,v){
 if(FPT!=="__all"&&!enPunto(p,FPT,v).length)return false;

 return viajeros(p).some(function(x){return (x.nombre||"").toLowerCase().indexOf(q)>=0})}

 capInfo()}
function setVPunto(x){if(x==="__otro"){var t=prompt("Escribe el punto de salida:",window._vpunto||"");if(t===null)return;window._vpunto=t.trim()}else window._vpunto=x;
 document.getElementById("vpt").innerHTML=ptabs(window._vpunto,"setVPunto")}
function guardarViaje(id){
 var dest=document.getElementById("v-dest").value.trim();if(!dest){toast("Pon el destino");return}
